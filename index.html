<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sportelina</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5A4466; --muted:#9C8798; --soft:#CDB9CC;
  --card:rgba(255,250,247,.6); --card-line:rgba(255,255,255,.85);
  --acc:#D49BC4; --acc-text:#A0679A; --acc-soft:rgba(212,155,196,.25); --acc-line:rgba(212,155,196,.55); --acc-glow:rgba(212,155,196,.38);
  --grad:linear-gradient(135deg,#E2BBD7,#D49BC4);
  --shadow:0 10px 30px rgba(150,110,150,.16);
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#FBF3EF;color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- фон ---------- */
.paint{position:fixed;inset:0;z-index:0;pointer-events:none;background:#FBF3EF;transition:background .4s}
.paint svg{position:absolute;inset:0;width:100%;height:100%}
.paper{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .5 0 0 0 0 .55 0 0 0 .2 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.loading{min-height:70vh;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted)}

/* ---------- заголовки ---------- */
.top h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:38px;line-height:1}
.top .date{color:var(--muted);font-size:13px;margin-top:6px}
.sec-title{font-family:var(--serif);font-style:italic;font-weight:600;font-size:25px;margin:24px 4px 10px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title small{font-family:Manrope,sans-serif;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500}

/* ---------- банка ---------- */
.jarzone{display:flex;flex-direction:column;align-items:center;margin-top:6px}
svg.jar{width:min(74vw,250px);height:auto;overflow:visible}
.count-big{font-family:var(--serif);font-style:italic;font-size:24px;margin-top:2px}
.count-big b{font-size:42px;font-weight:700;margin-right:4px}
.shelf{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:13px;margin-top:6px}
.shelf span{margin-left:6px}
.drop{animation:drop .85s cubic-bezier(.35,1.3,.6,1)}
@keyframes drop{from{transform:translateY(-240px)}to{transform:none}}
.spark{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.rise{animation:rise 4.5s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1)}}

/* ---------- карточки ---------- */
.card{background:var(--card);border:1px solid var(--card-line);border-radius:24px;box-shadow:var(--shadow);
  backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);padding:4px 16px}
.card+.card{margin-top:12px}
.hint-empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center;line-height:1.55}
.pill{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:13px;margin-top:12px;box-shadow:0 4px 12px var(--acc-glow)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.dot.big{width:16px;height:16px}

/* ежедневные */
.srow{display:flex;align-items:center;gap:12px;padding:14px 0}
.srow+.srow{border-top:1px dashed rgba(200,170,200,.45)}
.sname{flex:1;font-weight:600;min-width:0}
.snum{font-family:var(--serif);font-style:italic;font-weight:700;font-size:32px;min-width:30px;text-align:center;line-height:1}
.rb{width:42px;height:42px;border-radius:50%;font-size:22px;font-weight:600;display:grid;place-items:center;transition:transform .12s;flex-shrink:0}
.rb:active{transform:scale(.9)}
.rb.minus{background:rgba(255,255,255,.6);color:var(--muted);border:1px solid #fff}
.rb.plus{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--acc-glow)}
.chev{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}

/* неделя */
.group{padding:12px 0}
.group+.group{border-top:1px dashed rgba(200,170,200,.45)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.gname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.link{font-size:12.5px;color:var(--acc-text);font-weight:600;text-align:right}
.item{display:flex;align-items:center;gap:12px;padding:8px 0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);flex-shrink:0;display:grid;place-items:center;background:rgba(255,255,255,.55);transition:background .2s,transform .12s}
.tick:active{transform:scale(.88)}
.item.done .tick{background:var(--c)}
.tick svg{width:14px;height:14px}
.iname{flex:1;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.item.done .iname{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(156,135,152,.5)}
.more{width:34px;height:30px;border-radius:10px;color:var(--soft);font-size:11px;letter-spacing:1px;flex-shrink:0}
.nodir{color:var(--muted);font-size:13.5px;padding:6px 0 4px}
.dhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;padding-top:10px;border-top:1px dashed rgba(200,170,200,.45);font-size:12.5px;font-weight:700;color:var(--muted)}
.dlist .item{padding:5px 0}
.dwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease,opacity .3s ease}
.dwrap>*{overflow:hidden;min-height:0}
.dwrap.folded{grid-template-rows:0fr;opacity:0}
.dtoggle{display:flex;align-items:center;gap:6px;font:inherit;color:inherit;padding:4px 0}
.chev-s{display:inline-block;font-size:10px;transition:transform .25s ease}
.folded .chev-s{transform:rotate(-90deg)}
.dhead [data-a=clearDone],#p-clear{transition:opacity .25s ease,visibility .25s}
.dhead.folded [data-a=clearDone],.done-head.folded #p-clear{opacity:0;visibility:hidden;pointer-events:none}
.ex-list.done{margin-bottom:0}
.done-head .dtoggle{background:none;padding:4px 0;color:var(--muted);font-size:13px;font-weight:700}
.dlist .item .tick{transform:scale(.86)}
.nodir .pill{margin-top:8px}
.add-btn{display:block;width:100%;margin-top:12px;padding:14px;border-radius:18px;border:1.5px dashed var(--acc-line);
  color:var(--acc-text);font-weight:700;background:rgba(255,255,255,.35)}

/* статистика */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles .card{padding:16px;margin:0}
.tile-v{font-family:var(--serif);font-style:italic;font-weight:700;font-size:42px;line-height:1}
.tile-l{font-size:12.5px;color:var(--muted);margin-top:6px}
.bar-row{padding:12px 0}
.bar-row+.bar-row{border-top:1px dashed rgba(200,170,200,.45)}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.65);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.bar-sub{font-size:12px;color:var(--muted);margin-top:5px}
.mini3{display:flex;gap:8px;margin-top:10px}
.mini3 div{flex:1;background:rgba(255,255,255,.6);border-radius:14px;padding:8px 4px;text-align:center}
.mini3 b{display:block;font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.1}
.mini3 span{font-size:11.5px;color:var(--muted)}
.note{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);text-align:center;margin-top:22px}

/* программы */
.dir{padding:14px 16px}
.dir-head{display:flex;align-items:center;gap:12px;cursor:pointer}
.dname{font-weight:700;font-size:16px}
.small{font-size:12.5px;color:var(--muted)}
.prog{margin-top:12px;padding:12px 12px 10px;border-radius:18px;background:rgba(255,255,255,.5)}
.prog.cur{box-shadow:inset 0 0 0 1.5px var(--c)}
.prog-head{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.prog-head .chev{font-size:18px;font-weight:400}
.pl{width:24px;height:24px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.now{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--c);color:#fff}
.prog ul{list-style:none;margin:6px 0 0}
.prog li{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.prog li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c);flex-shrink:0}
.prog li span{flex:1}
.x{color:var(--soft);font-size:20px;width:30px;height:30px;line-height:1}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid #fff;background:rgba(255,255,255,.75);outline:none;font-size:16px}
.add-row input:focus{border-color:var(--acc)}
.add-row button{width:44px;border-radius:12px;background:var(--c);color:#fff;font-size:20px;font-weight:700}
.ghost{margin-top:12px;width:100%;padding:11px;border-radius:14px;border:1.5px dashed var(--acc-line);color:var(--acc-text);font-weight:700;font-size:14px}

/* оформление */
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 0 6px}
.bgt{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.25}
.bgt i{display:block;width:100%;aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.9),0 4px 12px rgba(150,110,150,.15);transition:box-shadow .2s;position:relative}
.bgt.on{color:var(--ink)}
.bgt.on i{box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--acc)}
.bgt i em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.sub-opt{padding:4px 0 14px}
.sub-opt .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
.look-row{padding:14px 0}
.look-row+.look-row{border-top:1px dashed rgba(200,170,200,.45)}
.look-row .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
.preview-btn{display:flex;align-items:center;gap:12px;margin-top:14px}
.preview-btn .fake{flex:1;height:42px;border-radius:14px;background:var(--grad);box-shadow:0 4px 12px var(--acc-glow);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.preview-btn .fake2{flex:1;height:42px;border-radius:14px;border:1.5px dashed var(--acc-line);color:var(--acc-text);font-weight:700;display:grid;place-items:center;font-size:14px}
.jars2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jars2 button{background:rgba(255,255,255,.55);border-radius:18px;padding:10px 6px 10px;font-weight:600;font-size:13px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 0 1px #fff}
.jars2 button.on{color:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--acc)}
.jars2 svg{width:100%;max-width:92px;height:auto}
.tiny{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}

/* нижнее меню */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;
  display:flex;gap:2px;padding:6px;border-radius:24px;width:min(440px,calc(100% - 24px));
  background:rgba(255,250,248,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:8px 2px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);transition:background .2s;min-width:0}
.tabs button.on{background:var(--acc-soft);color:var(--ink)}
.tabs svg{width:22px;height:22px}

/* шторка */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(90,68,102,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.overlay.open{opacity:1}
.sheet{width:100%;max-width:460px;max-height:88vh;overflow:auto;
  background:linear-gradient(180deg,#FCF4F5,#F8F3FA);border-radius:28px 28px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(150,100,140,.2)}
.overlay.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--soft);margin:0 auto 14px;opacity:.7}
.sheet h3{font-family:var(--serif);font-style:italic;font-weight:600;font-size:27px;line-height:1.1;margin-bottom:14px;overflow-wrap:anywhere}
.sheet h3.long{font-family:inherit;font-style:normal;font-size:17px;line-height:1.4;font-weight:600}
.field{margin-bottom:16px}
.field label.t{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.field input[type=text]{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #F0E2EA;background:#fff;outline:none;font-size:16px}
.field input[type=text]:focus{border-color:var(--acc)}
.field textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #F0E2EA;background:#fff;outline:none;font-size:16px}
.field textarea:focus{border-color:var(--acc)}
textarea.grow{display:block;resize:none;overflow:hidden;font:inherit;font-size:16px;line-height:1.35;color:inherit;min-height:48px;max-height:40vh}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button,.sw-own{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7);transition:box-shadow .15s}
.swatches button.on,.sw-own.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.sw-own{position:relative;display:block;cursor:pointer;
  background:conic-gradient(#F4A3BE,#F6D08B,#A9DCC3,#9DC3EE,#C4A9EC,#F4A3BE)}
.sw-own::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff}
.sw-own.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.sw-own input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--acc-soft);color:var(--ink)}
.explain{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.dates{display:flex;gap:10px;margin-top:10px}
.dates label{flex:1;min-width:0;font-size:12px;color:var(--muted);font-weight:600}
.dates input{display:block;width:100%;margin-top:6px;padding:11px 12px;border-radius:14px;border:1px solid #F0E2EA;background:#fff;outline:none;font-size:16px;color:var(--ink);min-height:46px;-webkit-appearance:none;appearance:none}
.dates input:focus{border-color:var(--acc)}
.pdate{font-size:12px;color:var(--muted);font-weight:600;margin:4px 0 0 32px}
.prow{display:flex;align-items:center;gap:8px;width:100%;border-top:1px dashed rgba(200,170,200,.45)}
.pbody{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 4px;text-align:left}
.prow,.dir-head,.item,.ex-list li{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item.dragging{margin:0 -10px;padding:8px 10px}
.ex-list li.dragging{border-radius:14px}
.drag-item{position:relative;z-index:1}
.dragging{z-index:10;transition:box-shadow .2s,background .2s;box-shadow:0 14px 34px rgba(150,100,140,.28);background:rgba(255,252,250,.97);border-radius:16px}
.card.dir.dragging{border-radius:24px}
.drag-anim{transition:transform .18s ease}
.prow .pn{flex:1;min-width:0;font-weight:600}
.pst{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.75);color:var(--muted);white-space:nowrap}
.pst.now{background:var(--c);color:#fff}
.pst.off{background:transparent;border:1px dashed var(--soft)}
.prow .chev{margin-left:0}
.dir .ghost{margin-top:8px}
.ex-list{list-style:none;margin:0 0 8px}
.ex-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;border-radius:14px;background:#fff;font-size:15px}
.ex-list li span{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.ex-list li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c);flex-shrink:0}
.ex-empty{font-size:13px;color:var(--muted);padding:2px 2px 8px}
.done-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.done-head button{font-size:13px;font-weight:700;color:var(--acc);padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.8)}
.ex-list.done li{background:rgba(255,255,255,.5);color:var(--muted)}
.ex-list.done li span{text-decoration:line-through;text-decoration-color:rgba(156,135,152,.5)}
.ex-list.done li::before{opacity:.45}
.ex-list li textarea.inline{width:100%;min-height:0;padding:0;border:none;background:transparent;outline:none;font-size:15px;-webkit-user-select:text;user-select:text}
.ex-list li span{cursor:text}
.back{color:var(--soft);font-size:18px;width:30px;height:30px;line-height:1;flex-shrink:0}
.prow .pn small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.ex-list li{transition:height .22s ease,opacity .22s ease,margin .22s ease,padding .22s ease;overflow:hidden;box-sizing:border-box}
.ex-list li.entering{opacity:0;padding-top:0;padding-bottom:0}
.ex-list li.leaving{opacity:0;margin-bottom:0;padding-top:0;padding-bottom:0}
.ex-list li.dragging{overflow:visible}
.ex-add{display:flex;gap:8px}
.ex-add textarea{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid #F0E2EA;background:#fff;outline:none;font-size:16px}
.ex-add textarea:focus{border-color:var(--acc)}
.ex-add{align-items:flex-end}
.ex-add button{height:48px}
.ex-add button{width:48px;border-radius:14px;background:var(--c);color:#fff;font-size:22px;font-weight:700}
.seg3 button{font-size:13px;padding:10px 4px}
.tag{font-size:12.5px;color:var(--acc-text);font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:#fff;font-size:14px;font-weight:600}
.chip .dot{width:9px;height:9px;box-shadow:none}
.chip.on{box-shadow:inset 0 0 0 2px var(--acc)}
.chip.add{background:transparent;border:1.5px dashed var(--acc-line);color:var(--acc-text)}
.newdir{margin-top:12px;padding:14px;border-radius:18px;background:rgba(255,255,255,.6)}
.newdir input[type=text]{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #F0E2EA;background:#fff;outline:none;font-size:16px;margin-bottom:12px}
.newdir input[type=text]:focus{border-color:var(--acc)}
.newdir .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.newdir .btn{margin-top:14px}
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-weight:700;font-size:15px;margin-top:10px;text-align:center}
.btn.main{background:var(--grad);color:#fff;box-shadow:0 6px 16px var(--acc-glow)}
.btn.soft{background:rgba(255,255,255,.7);color:var(--acc-text)}
.btn.danger{color:#C27389}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:16px;background:#fff;margin-bottom:8px;text-align:left;font-weight:600}
.opt.on{box-shadow:inset 0 0 0 2px var(--acc)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);opacity:0;z-index:30;
  padding:12px 18px;border-radius:16px;background:rgba(255,250,248,.95);box-shadow:var(--shadow);font-weight:600;font-size:14px;
  transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){.drop,.spark,.rise{animation:none}}

<body>
<div class="paint" id="paint">

      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="70"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter></defs>
    <g filter="url(#bloom)" opacity=".5" id="blobs">
      <ellipse cx="60" cy="90" rx="140" ry="80"/>
      <ellipse cx="360" cy="160" rx="120" ry="90"/>
      <ellipse cx="20" cy="430" rx="130" ry="90"/>

      <ellipse cx="330" cy="650" rx="90" ry="60"/>

<script>
/* ================= основа ================= */
const TG = window.Telegram && window.Telegram.WebApp;
const CLOUD = !!(TG && TG.initData && TG.CloudStorage && (!TG.isVersionAtLeast || TG.isVersionAtLeast('6.9')));
const LS = 'starjar-v1', PHOTO_LS = 'starjar-photo', CAP = 50;
const COLORS = ['#E8A3B6','#B8A4DE','#9DBFE3','#F2BD98','#A8D5C0','#E3B86E','#D59BC8','#F4C26B'];
const ACCENTS = ['#D49BC4','#E8A0B4','#B39DDB','#8FB3E0','#E7A982','#7FC1A6','#C9A45C','#A08AA8'];
const BG_COLORS = ['#FBF3EF','#F8EEF3','#F3EFFA','#EEF3FA','#F1F7F2','#FBF4E8','#F6F1EA','#EFE9F1'];
const BGS = {
  rose:    {n:'Розовая акварель', base:'#FBF3EF', c:['#F2B3C7','#C8B6EC','#A9C6EE','#F4BCCB','#D9C4EE','#F8CFB2']},
  lavender:{n:'Лавандовый туман', base:'#F6F2FB', c:['#CDB8F0','#E6C3EC','#B7C3F2','#D9C9F5','#C3B2EA','#EFD6F0']},
  peach:   {n:'Персиковый рассвет', base:'#FDF5EE', c:['#F9C9A8','#F6B5B0','#FADDB0','#F3BFC4','#F7D2A9','#F8C3A0']},
  sky:     {n:'Небо', base:'#F3F6FC', c:['#B4CDF2','#C9D9F7','#A9D2EC','#D3CCF2','#BFDDF3','#E4D8F3']},
  mint:    {n:'Мята', base:'#F3F9F5', c:['#B8E3D2','#CFE8C4','#A9D6E0','#D6EDD9','#BFE0E8','#E8EFC8']},
  plain:   {n:'Однотонный'},
  photo:   {n:'Своё фото'}
};
const LETTERS = 'АБВГДЕЖЗИКЛМНОПРСТ';
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const STABLE_COLOR = '#F4C26B', ONE_COLOR = '#F2BD98';
const TICK = '<svg viewBox="0 0 20 20"><path d="M10 1Q11.4 8.6 19 10Q11.4 11.4 10 19Q8.6 11.4 1 10Q8.6 8.6 10 1Z" fill="#fff"/></svg>';

let state = null, tab = 'home', animNew = false, photo = null;
try{photo=localStorage.getItem(PHOTO_LS)}catch(e){}

function fresh(){return {v:1,ts:0,dirs:[],stable:[{id:'eyes',name:'Зарядка для глаз',color:STABLE_COLOR}],weeks:{},lastWeek:null,carry:[],log:{},seq:[],days:{},
  theme:{bg:'rose',bgColor:'#F8EEF3',accent:'#D49BC4',jar:'classic'}}}
function normalize(s){
  if(!s || s.v!==1) return fresh();
  const f=fresh();
  for(const k in f) if(s[k]===undefined) s[k]=f[k];
  s.theme=Object.assign({},f.theme,s.theme||{});
  if(!SHAPES[s.theme.jar]) s.theme.jar='classic';
  s.dirs.forEach(d=>{if(!d.freq)d.freq='week';d.progs.forEach(p=>{if(!p.status)p.status=(p.from&&p.to)?'dates':'queue';if(!p.mode)p.mode='repeat';p.items.forEach(it=>{if(!it.id)it.id=uid()})})});
  s.stable.forEach(x=>{if(!x.color)x.color=STABLE_COLOR});
  return s;
}
function uid(){return Math.random().toString(36).slice(2,9)}
function grow(t){if(!t)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,window.innerHeight*.4)+'px';t.style.overflowY=t.scrollHeight+2>window.innerHeight*.4?'auto':'hidden'}
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('textarea.grow'))grow(e.target)});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekKey(){return ymd(monday(new Date()))}
function weekLabel(){const a=monday(new Date()),b=new Date(a);b.setDate(a.getDate()+6);return a.getDate()+' '+MON[a.getMonth()]+' — '+b.getDate()+' '+MON[b.getMonth()]}
function pl(n,a,b,c){const m=Math.abs(n)%100,m1=m%10;if(m>10&&m<20)return c;if(m1>1&&m1<5)return b;if(m1===1)return a;return c}
function rnd(i,s){const x=Math.sin(i*12.9898+s*78.233)*43758.5453;return x-Math.floor(x)}
function dirById(id){return state.dirs.find(d=>d.id===id)}
function stableById(id){return state.stable.find(s=>s.id===id)}
function progOf(dId,pId){const d=dirById(dId);return d&&d.progs.find(p=>p.id===pId)}
function colorOf(k){const d=dirById(k);if(d)return d.color;if(k==='one')return ONE_COLOR;const s=stableById(k);return s?s.color:STABLE_COLOR}
function curWeek(){return state.weeks[weekKey()]}
function haptic(t){try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred(t||'light')}catch(e){}}
function dot(c,big){return `<span class="dot${big?' big':''}" style="--c:${c}"></span>`}

/* ================= цвета ================= */
function hexRgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return [n>>16&255,n>>8&255,n&255]}
function rgba(h,a){const [r,g,b]=hexRgb(h);return `rgba(${r},${g},${b},${a})`}
function mix(h,h2,t){const a=hexRgb(h),b=hexRgb(h2);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function lum(h){const [r,g,b]=hexRgb(h);return (0.299*r+0.587*g+0.114*b)/255}
function paintCSS(p){
  const c=p.c;
  return `radial-gradient(70% 45% at 10% 5%, ${rgba(c[0],.55)}, transparent 70%),radial-gradient(60% 40% at 95% 12%, ${rgba(c[1],.55)}, transparent 70%),radial-gradient(60% 35% at 0% 50%, ${rgba(c[2],.45)}, transparent 72%),radial-gradient(55% 35% at 100% 55%, ${rgba(c[3],.45)}, transparent 72%),radial-gradient(80% 40% at 50% 100%, ${rgba(c[5],.55)}, transparent 72%),${p.base}`;
}
function applyTheme(){
  const t=state.theme, root=document.documentElement.style;
  const a=t.accent, deep=lum(a)>.72?mix(a,'#3B2343',.55):mix(a,'#3B2343',.3);
  root.setProperty('--acc',a);
  root.setProperty('--acc-text',deep);
  root.setProperty('--acc-soft',rgba(a,.25));
  root.setProperty('--acc-line',rgba(a,.6));
  root.setProperty('--acc-glow',rgba(a,.38));
  root.setProperty('--grad',`linear-gradient(135deg,${mix(a,'#ffffff',.3)},${a})`);
  const paint=document.getElementById('paint'), svg=paint.querySelector('svg'), paper=document.getElementById('paper');
  let bg=t.bg; if(bg==='photo'&&!photo) bg='rose';
  let head;
  if(BGS[bg]&&BGS[bg].c){
    const p=BGS[bg];
    paint.style.background=paintCSS(p); svg.style.display='';
    paint.querySelectorAll('#blobs ellipse').forEach((e,i)=>e.setAttribute('fill',p.c[i]));
    paper.style.display=''; head=p.base;
  } else if(bg==='plain'){
    paint.style.background=t.bgColor; svg.style.display='none'; paper.style.display=''; head=t.bgColor;
  } else {
    paint.style.background=`linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)),url(${photo}) center/cover no-repeat`;
    svg.style.display='none'; paper.style.display='none'; head='#FFFFFF';
  }
  document.body.style.background=head;
  try{TG&&TG.setHeaderColor&&TG.setHeaderColor(head);TG&&TG.setBackgroundColor&&TG.setBackgroundColor(head)}catch(e){}
}

/* ================= хранение ================= */
let cloudTimer=null;
function save(){
  state.ts=Date.now();
  const str=JSON.stringify(state);
  try{localStorage.setItem(LS,str)}catch(e){}
  if(CLOUD){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave(str),700)}
}
function cloudSave(str){
  try{
    const ch=str.match(/[\s\S]{1,3800}/g)||[''];let left=ch.length;
    ch.forEach((c,i)=>TG.CloudStorage.setItem('c'+i,c,()=>{if(--left===0)TG.CloudStorage.setItem('n',String(ch.length))}));
  }catch(e){}
}
function loadAll(cb){
  let local=null;
  try{local=JSON.parse(localStorage.getItem(LS))}catch(e){}
  if(!CLOUD) return cb(local);
  let done=false;const fin=v=>{if(done)return;done=true;cb(v)};
  setTimeout(()=>fin(local),3000);
  try{
    TG.CloudStorage.getItem('n',(err,n)=>{
      n=parseInt(n,10);
      if(err||!n) return fin(local);
      const keys=Array.from({length:n},(_,i)=>'c'+i);
      TG.CloudStorage.getItems(keys,(e2,vals)=>{
        if(e2||!vals) return fin(local);
        try{
          const cloud=JSON.parse(keys.map(k=>vals[k]||'').join(''));
          fin(!local||(cloud.ts||0)>=(local.ts||0)?cloud:local);
        }catch(x){fin(local)}
      });
    });
  }catch(e){fin(local)}
}

/* ================= логика недели и дня ================= */
function isDaily(d){return !!d&&d.freq==='day'}
function mkItem(dir,name,prog,pid,pi){const o={id:uid(),dir:dir||null,name,prog:!!prog,done:false,doneOn:null};if(pid){o.pid=pid;o.pi=pi||null}return o}
// режим «Только несделанное»: выполненное остаётся в программе с пометкой doneAt и больше не приходит
function isOnce(p){return !!p&&p.mode==='once'}
function active(p){return isOnce(p)?p.items.filter(x=>!x.doneAt):p.items}
function progItemFor(p,i){return p&&p.items.find(x=>i.pi?x.id===i.pi:x.name===i.name)}
function linkedProgItem(i){
  if(!i.prog||!i.dir) return null; const d=dirById(i.dir); if(!d) return null;
  const cands=i.pid?[progOf(d.id,i.pid)]:[progOf(d.id,curWeek().progs[d.id]),datedFor(d,today())];
  for(const p of cands) if(isOnce(p)){const x=progItemFor(p,i); if(x) return x}
  return null;
}
function curDay(){return state.days[today()]}
function isDated(p){return !!(p&&p.status==='dates'&&p.from&&p.to)}
function cyc(d){return d.progs.filter(p=>(p.status||'queue')==='queue')}
function datedFor(d,date){return d.progs.find(p=>isDated(p)&&p.from<=date&&date<=p.to)}
function fmtD(k){const [y,m,dd]=k.split('-').map(Number);return dd+' '+MON[m-1]}
function skipOf(d){const w=curWeek();return (w.skip&&w.skip[d.id])||[]}
function dayProg(d,date){const dp=datedFor(d,date);if(dp)return dp;if(isDaily(d))return progOf(d.id,curWeek().progs[d.id]);return null}
function progItems(d,p){const sk=skipOf(d);return active(p).filter(it=>!sk.includes(it.name)).map(it=>mkItem(d.id,it.name,1,p.id,it.id))}
function refreshToday(d){
  const t=curDay(); if(!t) return;
  dropUndone(t,d.id);
  const p=dayProg(d,today()); if(!p) return;
  const done=new Set(t.items.filter(i=>i.dir===d.id&&i.prog).map(i=>i.name));
  progItems(d,p).forEach(x=>{if(!done.has(x.name))t.items.push(x)});
}
function startProgram(w,dir,idx,toToday){
  const list=cyc(dir), p=list[idx]; if(!p) return;
  w.progs[dir.id]=p.id;
  if(isDaily(dir)){if(toToday) refreshToday(dir)}
  else{
    const has=new Set(w.items.filter(i=>i.dir===dir.id).map(i=>i.name));
    active(p).forEach(it=>{if(!has.has(it.name)){has.add(it.name);w.items.push(mkItem(dir.id,it.name,1,p.id,it.id))}});
    if(!isOnce(p)) (p.carry||[]).forEach(n=>{if(!has.has(n)){has.add(n);w.items.push(mkItem(dir.id,n,1,p.id))}});
    p.carry=[];
  }
  dir.next=(idx+1)%list.length;
}
// невыполненные дела программы ждут её следующего включения
function stashUndone(w,d){
  if(!w||!d||isDaily(d)) return;
  const p=progOf(d.id,w.progs&&w.progs[d.id]); if(!p) return false;
  if(isOnce(p)) return true;
  p.carry=p.carry||[];
  w.items.forEach(i=>{if(i.dir===d.id&&i.prog&&!i.done&&!p.carry.includes(i.name))p.carry.push(i.name)});
  return true;
}
function sameIn(list,dir,name){return list.some(x=>(x.dir||null)===(dir||null)&&x.name===name)}
function ensureWeek(){
  const key=weekKey();
  if(state.weeks[key]) return;
  const prev=state.lastWeek?state.weeks[state.lastWeek]:null;
  const w={items:[],progs:{},skip:{}};
  if(prev){
    state.dirs.forEach(d=>stashUndone(prev,d));
    prev.items.forEach(i=>{
      if(i.done) return;
      const d=i.dir&&dirById(i.dir);
      const P=d&&!isDaily(d)&&progOf(d.id,prev.progs&&prev.progs[d.id]);
      if(i.prog&&P&&(!isOnce(P)||progItemFor(P,i))) return; // ждёт в своей программе
      if(!sameIn(state.carry,i.dir,i.name)) state.carry.push({dir:i.dir,name:i.name,prog:false});
    });
  }
  state.weeks[key]=w;
  state.dirs.forEach(dir=>{
    const list=cyc(dir); if(!list.length) return;
    let idx=(dir.next||0)%list.length;
    for(let k=0;k<list.length;k++){const q=list[(idx+k)%list.length];if(!isOnce(q)||active(q).length){idx=(idx+k)%list.length;break}}
    startProgram(w,dir,idx,false);
  });
  state.carry.forEach(c=>{if(!sameIn(w.items,c.dir,c.name))w.items.push(mkItem(c.dir,c.name,c.prog))});
  state.carry=[];
  state.lastWeek=key;
  const keys=Object.keys(state.weeks).sort();
  while(keys.length>8) delete state.weeks[keys.shift()];
  save();
}
function ensureDay(){
  const key=today();
  if(state.days[key]) return;
  const items=[];
  state.dirs.forEach(d=>{const p=dayProg(d,key); if(p) items.push(...progItems(d,p))});
  const prevKey=Object.keys(state.days).filter(k=>k<key).sort().pop(), prev=prevKey&&state.days[prevKey];
  if(prev) prev.items.forEach(i=>{
    if(i.done||i.prog||sameIn(items,i.dir,i.name)) return; // дела программы и так придут по программе
    items.push(mkItem(i.dir,i.name,0));
  });
  state.days[key]={items};
  const ks=Object.keys(state.days).sort();
  while(ks.length>14) delete state.days[ks.shift()];
  save();
}
function findItem(id){
  const w=curWeek(); let it=w.items.find(i=>i.id===id);
  if(it) return {it,list:w,kind:'week'};
  const d=curDay(); it=d&&d.items.find(i=>i.id===id);
  return it?{it,list:d,kind:'day'}:null;
}
function dropUndone(list,dirId){list.items=list.items.filter(i=>!(i.dir===dirId&&i.prog&&!i.done))}
function switchProgram(dir,idx){
  if(!isDaily(dir)){stashUndone(curWeek(),dir);dropUndone(curWeek(),dir.id)}
  startProgram(curWeek(),dir,idx,true);
}
function fixNext(d){
  const cl=cyc(d), i=cl.findIndex(p=>p.id===curWeek().progs[d.id]);
  d.next=i>=0?(i+1)%cl.length:(cl.length?(d.next||0)%cl.length:0);
}
function syncWeek(d){
  if(isDaily(d)) return;
  const w=curWeek(), p=progOf(d.id,w.progs[d.id]);
  const done=new Set(w.items.filter(i=>i.dir===d.id&&i.prog&&i.done).map(i=>i.name));
  dropUndone(w,d.id);
  if(p&&cyc(d).includes(p)) active(p).forEach(it=>{if(!done.has(it.name))w.items.push(mkItem(d.id,it.name,1,p.id,it.id))});
}
function changeFreq(d,f){
  if(d.freq===f) return;
  const w=curWeek(), p=progOf(d.id,w.progs[d.id]);
  if(!isDaily(d)) dropUndone(w,d.id);
  d.freq=f;
  refreshToday(d);
  if(!isDaily(d)&&p&&!isDated(p)) active(p).forEach(it=>w.items.push(mkItem(d.id,it.name,1,p.id,it.id)));
}

/* ================= звёздочки ================= */
function addStar(key,date){
  state.seq.push(key);
  const d=state.log[date]||(state.log[date]={});
  d[key]=(d[key]||0)+1;
  animNew=true;
  if(state.seq.length%CAP===0) setTimeout(()=>toast('Банка полна! Следующая звезда начнёт новую'),900);
}
function removeStar(key,date){
  const i=state.seq.lastIndexOf(key); if(i>-1) state.seq.splice(i,1);
  const d=state.log[date];

function bindColor(el,id,cb){
  const box=el.querySelector(`[data-cf="${id}"]`); if(!box) return;
  const own=box.querySelector('.sw-own'), inp=own.querySelector('input');
  const mark=t=>box.querySelectorAll('[data-c],.sw-own').forEach(x=>x.classList.toggle('on',x===t));
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{mark(b);cb(b.dataset.c)});

document.getElementById('photoIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const m=1400, s=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let url=c.toDataURL('image/jpeg',.82);
      try{localStorage.setItem(PHOTO_LS,url)}catch(x){
        url=c.toDataURL('image/jpeg',.6);
        try{localStorage.setItem(PHOTO_LS,url)}catch(y){toast('Фото не сохранится после закрытия — оно слишком большое')}
      }
      photo=url; state.theme.bg='photo'; save(); applyTheme(); render();
    };
    img.onerror=()=>toast('Не получилось открыть это фото');
    img.src=r.result;
  };
  r.readAsDataURL(f);
});

      doneList.innerHTML=dn.map(x=>`<li data-id="${x.id}"><span>${esc(x.name)}</span><button type="button" class="back" aria-label="Вернуть в программу">↺</button></li>`).join('');
    };
    const draw=()=>{const a=dr.items.filter(isAct);list.innerHTML=a.length?a.map(liHTML).join(''):EMPTY;drawDone()};
    draw();
    sortable(list,'li','li',ids=>{dr.items=[...ids.map(id=>dr.items.find(x=>x.id===id)).filter(Boolean),...dr.items.filter(x=>!ids.includes(x.id))];draw()});
    const fk='p:'+(orig?orig.id:'new');
    const applyFold=f=>{el.querySelector('#p-dhead').classList.toggle('folded',f);el.querySelector('#p-dwrap').classList.toggle('folded',f)};
    applyFold(isFolded(fk));
    el.querySelector('#p-fold').onclick=()=>{applyFold(setFold(fk));haptic('light')};
    doneList.addEventListener('click',e=>{const b=e.target.closest('.back');if(!b)return;const x=dr.items.find(y=>y.id===b.closest('li').dataset.id);if(x){delete x.doneAt;draw();haptic('light')}});
    el.querySelector('#p-clear').onclick=()=>{dr.items=dr.items.filter(x=>!x.doneAt);draw();toast('Выполненное убрано — не забудь «Сохранить»')};
    const mex={repeat:'Каждый раз, когда программа включается, приходит весь список заново.',
               once:'Приходит только то, что ещё не сделано. Выполненное опускается в «Выполнено» — его можно вернуть ↺ или очистить.'};
    const msegs=el.querySelectorAll('[data-m]');
    const setM=v=>{dr.mode=v;msegs.forEach(b=>b.classList.toggle('on',b.dataset.m===v));el.querySelector('#p-mex').textContent=mex[v];draw()};
    setM(dr.mode); msegs.forEach(b=>b.onclick=()=>setM(b.dataset.m));
    const inp=el.querySelector('#p-new'), addBtn=el.querySelector('#p-addbtn');
    // кнопки «+» и «×» не забирают фокус у поля — клавиатура не прячется и не выскакивает заново
    const keepFocus=e=>{if(e.target.closest('.x,#p-addbtn'))e.preventDefault()};
    list.addEventListener('mousedown',keepFocus); addBtn.addEventListener('mousedown',keepFocus);
    // удаление: строка плавно схлопывается, остальные мягко подтягиваются
    list.addEventListener('click',e=>{
      const sp=e.target.closest('li > span'); if(sp&&!sp.querySelector('textarea')) return editInline(sp);
      const b=e.target.closest('.x'); if(!b) return;
      const li=b.closest('li'); if(!li||li.classList.contains('leaving')) return;
      dr.items=dr.items.filter(x=>x.id!==li.dataset.id);
      li.style.height=li.offsetHeight+'px'; li.offsetHeight;
      li.classList.add('leaving'); li.style.height='0px';
      setTimeout(()=>{li.remove(); if(!dr.items.some(isAct)) draw()},230);
    });
    const editInline=sp=>{
      const x=dr.items.find(y=>y.id===sp.closest('li').dataset.id); if(!x) return;
      const t=document.createElement('textarea'); t.className='grow inline'; t.rows=1; t.value=x.name; t.setAttribute('enterkeyhint','done');
      sp.textContent=''; sp.appendChild(t); grow(t); t.focus(); t.setSelectionRange(t.value.length,t.value.length);
      const fin=()=>{const v=t.value.trim(); if(v) x.name=v; sp.textContent=x.name};
      t.addEventListener('blur',fin,{once:true});
      t.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}});
    };
    // добавление: дописываем одну строку с плавным появлением, без перерисовки всего списка
    const add=()=>{const v=inp.value.trim();if(!v)return inp.focus();
      const x={id:uid(),name:v}; dr.items.push(x);
      if(list.querySelector('.ex-empty')) list.innerHTML='';
      list.insertAdjacentHTML('beforeend',liHTML(x));
      const li=list.lastElementChild, h=li.offsetHeight;
      li.style.height='0px'; li.classList.add('entering'); li.offsetHeight;
      li.style.height=h+'px'; li.classList.remove('entering');
      setTimeout(()=>{li.style.height=''},240);
      inp.value='';grow(inp);
      if(document.activeElement!==inp) inp.focus({preventScroll:true});
      setTimeout(()=>inp.scrollIntoView({block:'nearest',behavior:'smooth'}),240);
    };
    addBtn.onclick=add;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
    const segs=el.querySelectorAll('[data-s]');
    const setS=v=>{dr.status=v;segs.forEach(b=>b.classList.toggle('on',b.dataset.s===v));el.querySelector('#p-datebox').style.display=v==='dates'?'':'none';el.querySelector('#p-ex').textContent=ex[v]};
    setS(dr.status); segs.forEach(b=>b.onclick=()=>setS(b.dataset.s));
    if(isNew) setTimeout(()=>el.querySelector('#p-name').focus(),320);
    el.querySelector('#p-save').onclick=()=>{
      const nm=el.querySelector('#p-name');
      dr.name=nm.value.trim(); if(!dr.name){nm.focus();return}
      if(inp.value.trim()) add();
      if(dr.status==='dates'){
        dr.from=el.querySelector('#p-from').value; dr.to=el.querySelector('#p-to').value;
        if(!dr.from||!dr.to){toast('Выбери обе даты');return}
        if(dr.from>dr.to){toast('Дата начала позже даты конца');return}
      }
      const w=curWeek();
      const p=orig||{id:uid()};
      if(dr.mode!=='once') dr.items.forEach(x=>delete x.doneAt);
      p.name=dr.name; p.items=dr.items; p.status=dr.status; p.mode=dr.mode;
      if(dr.status==='dates'){p.from=dr.from;p.to=dr.to} else {delete p.from;delete p.to}
      if(isNew) d.progs.push(p);
      if(w.progs[d.id]===p.id&&p.status!=='queue') delete w.progs[d.id];
      fixNext(d);
      if(p.status==='queue'&&!w.progs[d.id]) startProgram(w,d,cyc(d).indexOf(p),true);
      fixNext(d);
      syncWeek(d); refreshToday(d);
      save();close();render();
    };
    const del=el.querySelector('#p-del');
    if(del) confirmBtn(del,'Нажми ещё раз — программа удалится',()=>{
      const w=curWeek();
      d.progs=d.progs.filter(x=>x!==orig);
      if(w.progs[d.id]===orig.id) delete w.progs[d.id];
      fixNext(d);
      syncWeek(d); refreshToday(d);
      save();close();render();
    });
  });
}
function stableSheet(id){
  const s=id?stableById(id):null;
  const st={color:s?s.color:COLORS[(state.stable.length+3)%COLORS.length]};
  sheet(s?'Ежедневная задача':'Новая ежедневная задача',`
    <div class="field"><label class="t">Название</label><input type="text" id="s-name" maxlength="40" placeholder="Название задачи" value="${s?esc(s.name):''}"></div>
    <div class="field"><label class="t">Цвет звёздочек</label>${colorField('sc',st.color,COLORS)}</div>
    <button class="btn main" id="s-save">Сохранить</button>
    ${s?'<button class="btn danger" id="s-del">Удалить задачу</button>':''}`,(el,close)=>{
    bindColor(el,'sc',c=>st.color=c);
    el.querySelector('#s-save').onclick=()=>{
      const inp=el.querySelector('#s-name'),name=inp.value.trim(); if(!name) return inp.focus();
      if(s) Object.assign(s,{name,color:st.color}); else state.stable.push({id:uid(),name,color:st.color});
      save();close();render();
    };
    if(s) confirmBtn(el.querySelector('#s-del'),'Нажми ещё раз — задача удалится',()=>{state.stable=state.stable.filter(x=>x!==s);save();close();render()});
  });
}

/* ================= действия ================= */
const A={
  tab:t=>{tab=t.dataset.t;render();window.scrollTo(0,0)},
  sPlus:t=>{addStar(t.dataset.id,today());haptic('light');save();render()},
  sMinus:t=>{const c=(state.log[today()]||{})[t.dataset.id]||0;if(!c)return;removeStar(t.dataset.id,today());save();render()},
  toggle:t=>toggleItem(t.dataset.id),
  fold:t=>{const head=t.closest('.dhead'),f=setFold(t.dataset.k);head.classList.toggle('folded',f);head.nextElementSibling.classList.toggle('folded',f);haptic('light')},
  clearDone:t=>{const L=t.dataset.k==='day'?curDay():curWeek(), dId=t.dataset.d;
    L.items.forEach(i=>{if(i.done&&(dId?i.dir===dId:(!i.dir||!dirById(i.dir))))i.hidden=true});
    haptic('light');save();flip(render)},
  menu:t=>itemMenu(t.dataset.id),
  switch:t=>switchSheet(t.dataset.id),
  startNext:t=>{const d=dirById(t.dataset.id);const n=cyc(d).length;if(!n)return;startProgram(curWeek(),d,(d.next||0)%n,true);save();render();haptic('medium')},
  addOne:()=>addOneSheet(),
  addDir:()=>dirSheet(null),
  editDir:t=>dirSheet(t.dataset.id),
  addProg:t=>progSheet(t.dataset.id,null),
  editProg:t=>progSheet(t.dataset.d,t.dataset.p),
  addStable:()=>stableSheet(null),
  editStable:t=>stableSheet(t.dataset.id),
  bg:t=>{const k=t.dataset.k;if(k==='photo'&&!photo){document.getElementById('photoIn').click();return}state.theme.bg=k;save();applyTheme();render()},
  pickPhoto:()=>document.getElementById('photoIn').click(),
  jar:t=>{state.theme.jar=t.dataset.k;save();render();haptic('light')}
};
document.addEventListener('click',e=>{
  if(Date.now()<dragBlockUntil){e.preventDefault();e.stopPropagation();return}
  const t=e.target.closest('[data-a]');
  if(!t||t.closest('.sheet')||!state) return;
  const f=A[t.dataset.a]; if(f){e.preventDefault();f(t)}
});

let toastT;
function toast(m){
  let t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
  t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ================= перетаскивание ================= */
let dragBlockUntil=0, dragActive=false;
document.addEventListener('touchmove',e=>{if(dragActive)e.preventDefault()},{passive:false});
document.addEventListener('click',e=>{if(Date.now()<dragBlockUntil){e.preventDefault();e.stopPropagation()}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.drag-item'))e.preventDefault()});
function sortable(box,itemSel,handleSel,done){
  if(!box) return;
  box.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    const handle=e.target.closest(handleSel); if(!handle||!box.contains(handle)) return;
    const item=handle.closest(itemSel); if(!item||item.parentElement!==box) return;
    const items=()=>[...box.children].filter(x=>x.matches(itemSel));
    if(items().length<2) return;
    const sx=e.clientX, sy=e.clientY; let started=false, timer, baseY=sy, offset=0;
    const cleanup=()=>{clearTimeout(timer);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
    const start=()=>{started=true;dragActive=true;item.classList.add('dragging');haptic('medium')};
    const move=ev=>{
      if(!started){if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8){cleanup()}return}
      ev.preventDefault();
      const dy=ev.clientY-baseY;
      item.style.transform=`translateY(${dy}px)`;
      const list=items(), i=list.indexOf(item);
      const prev=list[i-1], next=list[i+1];
      if(prev){const r=prev.getBoundingClientRect(); if(ev.clientY<r.top+r.height/2){const t0=item.offsetTop;box.insertBefore(item,prev);baseY+=item.offsetTop-t0;item.style.transform=`translateY(${ev.clientY-baseY}px)`;haptic('light');return}}
      if(next){const r=next.getBoundingClientRect(); if(ev.clientY>r.top+r.height/2){const t0=item.offsetTop;box.insertBefore(next,item);baseY+=item.offsetTop-t0;item.style.transform=`translateY(${ev.clientY-baseY}px)`;haptic('light')}}
    };
    const finish=()=>{
      cleanup(); if(!started) return;
      dragActive=false; dragBlockUntil=Date.now()+400;
      item.classList.add('drag-anim'); item.style.transform='';
      setTimeout(()=>{item.classList.remove('dragging','drag-anim');done(items().map(x=>x.dataset.p||x.dataset.id))},190);
    };
    const up=()=>finish(), cancel=()=>{if(started)finish();else cleanup()};
    timer=setTimeout(start,380);
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',cancel);
  });
}
function bindProgsDrag(){
  sortable(document.getElementById('dirlist'),'.card.dir','.dir-head',ids=>{
    const order=ids.join(); if(order===state.dirs.map(d=>d.id).join()) return;
    state.dirs.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); save(); render();
  });
  document.querySelectorAll('.plist').forEach(box=>sortable(box,'.prow','.prow',ids=>{
    const d=dirById(box.dataset.d); if(!d) return;
    if(ids.join()===d.progs.map(p=>p.id).join()) return;
    d.progs.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); fixNext(d); save(); render();
  }));
}
function reorderIn(list,ids){
  const pos=[];list.items.forEach((it,i)=>{if(ids.includes(it.id))pos.push(i)});
  const moved=ids.map(id=>list.items.find(i=>i.id===id)).filter(Boolean);
  if(moved.length!==pos.length) return false;
  if(pos.every((p,k)=>list.items[p]===moved[k])) return false;
  pos.forEach((p,k)=>list.items[p]=moved[k]); return true;
}
function bindHomeDrag(){
  document.querySelectorAll('.ilist').forEach(box=>sortable(box,'.item','.item',ids=>{
    const list=box.dataset.k==='day'?curDay():curWeek();
    if(reorderIn(list,ids)){save();render()}
  }));
}
function render(){
  const v=document.getElementById('view');
  v.innerHTML=tab==='home'?renderHome():tab==='stats'?renderStats():tab==='progs'?renderProgs():renderLook();
  if(tab==='look') bindLook();
  if(tab==='progs') bindProgsDrag();
  if(tab==='home') bindHomeDrag();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  animNew=false;
}

/* ================= запуск ================= */
try{
  if(TG){
    TG.ready(); TG.expand();
    TG.disableVerticalSwipes&&TG.disableVerticalSwipes();
  }
}catch(e){}
loadAll(s=>{state=normalize(s);applyTheme();ensureWeek();ensureDay();render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state){ensureWeek();ensureDay();render()}});
</script>
