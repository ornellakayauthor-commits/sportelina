<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sportelina</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5A4466; --muted:#9C8798; --soft:#CDB9CC;
  --card:rgba(255,250,247,.6); --card-line:rgba(255,255,255,.85);
  --acc:#D49BC4; --acc-text:#A0679A; --acc-soft:rgba(212,155,196,.25); --acc-line:rgba(212,155,196,.55); --acc-glow:rgba(212,155,196,.38);
  --grad:linear-gradient(135deg,#E2BBD7,#D49BC4);
  --shadow:0 10px 30px rgba(150,110,150,.16);
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#FBF3EF;color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- фон ---------- */
.paint{position:fixed;inset:0;z-index:0;pointer-events:none;background:#FBF3EF;transition:background .4s}
.paint svg{position:absolute;inset:0;width:100%;height:100%}
.paper{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .5 0 0 0 0 .55 0 0 0 .2 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.loading{min-height:70vh;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted)}
.gate>div{max-width:320px;text-align:center;padding:0 16px}
.gate-t{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink);margin-bottom:10px}
.gate p{font-family:Manrope,sans-serif;font-style:normal;font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 6px}

/* ---------- заголовки ---------- */
.top h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:38px;line-height:1}
.top .date{color:var(--muted);font-size:13px;margin-top:6px}
.sec-title{font-family:var(--serif);font-style:italic;font-weight:600;font-size:25px;margin:24px 4px 10px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title small{font-family:Manrope,sans-serif;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500}

/* ---------- банка ---------- */
.jarzone{display:flex;flex-direction:column;align-items:center;margin-top:6px}
svg.jar{width:min(74vw,250px);height:auto;overflow:visible}
.count-big{font-family:var(--serif);font-style:italic;font-size:24px;margin-top:2px}
.count-big b{font-size:42px;font-weight:700;margin-right:4px}
.shelf{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:13px;margin-top:6px}
.shelf span{margin-left:6px}
svg.jar.sm{width:min(46vw,170px)}
.count-big.sm{font-size:19px}.count-big.sm b{font-size:32px}
.jar-cap{font-size:12.5px;color:var(--muted);margin-top:1px}
.drop{animation:drop .85s cubic-bezier(.35,1.3,.6,1)}
@keyframes drop{from{transform:translateY(-240px)}to{transform:none}}
.spark{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.rise{animation:rise 4.5s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1)}}

/* ---------- карточки ---------- */
.card{background:var(--card);border:1px solid var(--card-line);border-radius:24px;box-shadow:var(--shadow);
  backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);padding:4px 16px}
.card+.card{margin-top:12px}
.hint-empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center;line-height:1.55}
.pill{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:13px;margin-top:12px;box-shadow:0 4px 12px var(--acc-glow)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.dot.big{width:16px;height:16px}

/* ежедневные */
.srow{display:flex;align-items:center;gap:12px;padding:14px 0}
.srow+.srow{border-top:1px dashed rgba(200,170,200,.45)}
.sname{flex:1;font-weight:600;min-width:0}
.snum{font-family:var(--serif);font-style:italic;font-weight:700;font-size:32px;min-width:30px;text-align:center;line-height:1}
.rb{width:42px;height:42px;border-radius:50%;font-size:22px;font-weight:600;display:grid;place-items:center;transition:transform .12s;flex-shrink:0}
.rb:active{transform:scale(.9)}
.rb.minus{background:rgba(255,255,255,.6);color:var(--muted);border:1px solid #fff}
.rb.plus{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--acc-glow)}
.chev{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}

/* неделя */
.group{padding:12px 0}
.group+.group{border-top:1px dashed rgba(200,170,200,.45)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.gname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.link{font-size:12.5px;color:var(--acc-text);font-weight:600;text-align:right}
.ghead .link,.ghead .tag{min-width:0;max-width:62%;overflow-wrap:anywhere}
.ghead .gname{min-width:0;overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:12px;padding:8px 0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);flex-shrink:0;display:grid;place-items:center;background:rgba(255,255,255,.55);transition:background .2s,transform .12s}
.tick:active{transform:scale(.88)}
.item.done .tick{background:var(--c)}
.tick svg{width:14px;height:14px}
.iname{flex:1;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.item.done .iname{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(156,135,152,.5)}
.more{width:34px;height:30px;border-radius:10px;color:var(--soft);font-size:11px;letter-spacing:1px;flex-shrink:0}
.nodir{color:var(--muted);font-size:13.5px;padding:6px 0 4px}
.dhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;padding-top:10px;border-top:1px dashed rgba(200,170,200,.45);font-size:12.5px;font-weight:700;color:var(--muted)}
.dlist .item{padding:5px 0}
.jars{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:18px}
.top+.card{margin-top:18px}
.card+.jars{margin-top:12px}
.jcard{position:relative;min-height:132px;border-radius:24px;padding:14px 14px 13px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;overflow:hidden;
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);background:var(--c);color:var(--ink);transition:transform .15s}
.jcard:active{transform:scale(.97)}
.jcard .jname{font-family:var(--serif);font-style:italic;font-weight:700;font-size:21px;line-height:1.05;overflow-wrap:anywhere}
.jcard .jcnt{font-size:12px;font-weight:600;opacity:.75}
.jcard.big{min-height:120px;margin-bottom:16px}
.jcard.big .jname{font-size:24px}
.st-soft{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 20%,#fff),color-mix(in srgb,var(--c) 48%,#fff))}
.st-bold{background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 68%,#5A4466));color:#fff}
.st-dots{background:radial-gradient(circle,rgba(255,255,255,.95) 1.3px,transparent 1.8px) 0 0/15px 15px,linear-gradient(150deg,color-mix(in srgb,var(--c) 28%,#fff),color-mix(in srgb,var(--c) 58%,#fff))}
.jcard.has-photo{background-size:cover;background-position:center;color:#fff}
.jcard.has-photo .jname{text-shadow:0 1px 8px rgba(40,20,45,.35)}
.jcard.has-photo .jcnt{opacity:.9}
.jcard .jname,.jcard .jcnt{color:var(--tc,inherit)}
.tcrow{display:flex;align-items:flex-start;gap:10px}
.tcauto{flex-shrink:0;height:36px;padding:0 14px;border-radius:99px;background:#fff;font-size:13px;font-weight:700;color:var(--ink)}
.tcauto.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
.tcrow .swatches{flex:1}
.swatches button[data-c="#FFFFFF"]{box-shadow:inset 0 0 0 1px #E2D3DF}
.swatches button[data-c="#FFFFFF"].on{box-shadow:inset 0 0 0 1px #E2D3DF,0 0 0 2px #fff,0 0 0 4px var(--acc)}
.jcard.add{border:1.5px dashed var(--acc-line);background:rgba(255,255,255,.35);color:var(--acc-text);font-weight:700;align-items:center;justify-content:center;box-shadow:none;font-size:14px}
.jtitle{display:block}
.jbanner{display:block;height:128px;margin:0 0 14px;border-radius:20px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.phrow{display:flex;align-items:center;gap:8px}
.phrow .btn{margin:0;flex:1;padding:11px}
.phthumb{width:64px;height:48px;border-radius:12px;background-size:cover;background-position:center;flex-shrink:0}
.phadd{width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--acc-line);color:var(--acc-text);font-weight:700;font-size:14px;background:rgba(255,255,255,.5)}
#jx-stf{transition:opacity .2s}
#jx-stf.dim{opacity:.45}
.stxt small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.jedit{font-size:13px;font-weight:700;color:var(--acc-text);margin:-6px 0 14px;padding:4px 0}
.jl{list-style:none;margin:0 0 6px}
.jl li{background:#fff;border-radius:14px;margin-bottom:6px;padding:9px 8px 9px 12px;font-size:15px}
.jl.soft li{background:rgba(255,255,255,.6)}
.jl.done li{background:rgba(255,255,255,.5);color:var(--muted)}
.jl.done .jt{text-decoration:line-through;text-decoration-color:rgba(156,135,152,.5)}
.jrow{display:flex;align-items:center;gap:6px}
.jrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c);flex-shrink:0;margin-right:4px}
.jl.done .jrow::before{opacity:.45}
.jt{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;cursor:text}
.jt small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.jt textarea.inline{width:100%;min-height:0;padding:0;border:none;background:transparent;outline:none;font-size:15px;-webkit-user-select:text;user-select:text}
.pull{font-size:12.5px;font-weight:700;color:#fff;background:var(--c);padding:6px 11px;border-radius:99px;flex-shrink:0}
.pullbox{display:none;gap:6px;flex-wrap:wrap;justify-content:flex-start;margin:9px 0 2px 13px}
.jl li.open .pullbox{display:flex}
.pullbox button,.jdate{position:relative;display:inline-flex;align-items:center;margin:0;font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,#fff);color:var(--ink);cursor:pointer}
.jdate input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.jl li{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.jprev .jcard{width:62%;margin:0 auto 16px}
.jstyles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jstyles button{height:62px;border-radius:16px;font-size:13px;font-weight:700;display:flex;align-items:flex-end;padding:8px 10px;color:var(--ink);border:1px solid rgba(255,255,255,.75);background-color:var(--c)}
.jstyles button.st-bold{color:#fff}
.jstyles button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
.soon{cursor:pointer}
.srow2{display:flex;align-items:center;gap:10px;padding:8px 0}
.srow2+.srow2{border-top:1px dashed rgba(200,170,200,.45)}
.sday{font-size:12.5px;font-weight:700;color:var(--acc-text);min-width:74px}
.stxt{flex:1;min-width:0;overflow-wrap:anywhere}
.smore{font-size:12.5px;color:var(--muted);padding-top:6px}
.dwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease,opacity .3s ease}
.dwrap>*{overflow:hidden;min-height:0}
.dwrap.folded{grid-template-rows:0fr;opacity:0}
.dtoggle{display:flex;align-items:center;gap:6px;font:inherit;color:inherit;padding:4px 0}
.dtoggle{min-width:0;text-align:left}.dtoggle .chev-s{flex:none}.dlabel{min-width:0;overflow-wrap:anywhere}.dhead [data-a=clearDone]{flex:none;margin-left:12px}
.chev-s{display:inline-block;font-size:10px;transition:transform .25s ease}
.folded .chev-s{transform:rotate(-90deg)}
.dhead [data-a=clearDone],#p-clear,#j-clear{transition:opacity .25s ease,visibility .25s}
.dhead.folded [data-a=clearDone],.done-head.folded #p-clear,.done-head.folded #j-clear{opacity:0;visibility:hidden;pointer-events:none}
.ex-list.done{margin-bottom:0}
.done-head .dtoggle{background:none;padding:4px 0;color:var(--muted);font-size:13px;font-weight:700}
.dlist .item .tick{transform:scale(.86)}
.nodir .pill{margin-top:8px}
.add-btn{display:block;width:100%;margin-top:12px;padding:14px;border-radius:18px;border:1.5px dashed var(--acc-line);
  color:var(--acc-text);font-weight:700;background:rgba(255,255,255,.35)}

/* статистика */
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tiles .card{padding:16px;margin:0}
.tile-v{font-family:var(--serif);font-style:italic;font-weight:700;font-size:42px;line-height:1}
.tile-l{font-size:12.5px;color:var(--muted);margin-top:6px}
.bar-row{padding:12px 0}
.bar-row+.bar-row{border-top:1px dashed rgba(200,170,200,.45)}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.65);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.bar-sub{font-size:12px;color:var(--muted);margin-top:5px}
.mini3{display:flex;gap:8px;margin-top:10px}
.mini3 div{flex:1;background:rgba(255,255,255,.6);border-radius:14px;padding:8px 4px;text-align:center}
.mini3 b{display:block;font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.1}
.mini3 span{font-size:11.5px;color:var(--muted)}
.note{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);text-align:center;margin-top:22px}

/* программы */
.dir{padding:14px 16px}
.dir-head{display:flex;align-items:center;gap:12px;cursor:pointer}
.dname{font-weight:700;font-size:16px}
.small{font-size:12.5px;color:var(--muted)}
.prog{margin-top:12px;padding:12px 12px 10px;border-radius:18px;background:rgba(255,255,255,.5)}
.prog.cur{box-shadow:inset 0 0 0 1.5px var(--c)}
.prog-head{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.prog-head .chev{font-size:18px;font-weight:400}
.pl{width:24px;height:24px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.now{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--c);color:#fff}
.prog ul{list-style:none;margin:6px 0 0}
.prog li{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.prog li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c);flex-shrink:0}
.prog li span{flex:1}
.x{color:var(--soft);font-size:20px;width:30px;height:30px;line-height:1}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid #fff;background:rgba(255,255,255,.75);outline:none;font-size:16px}
.add-row input:focus{border-color:var(--acc)}
.add-row button{width:44px;border-radius:12px;background:var(--c);color:#fff;font-size:20px;font-weight:700}
.ghost{margin-top:12px;width:100%;padding:11px;border-radius:14px;border:1.5px dashed var(--acc-line);color:var(--acc-text);font-weight:700;font-size:14px}

/* оформление */
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 0 6px}
.bgt{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.25}
.bgt i{display:block;width:100%;aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.9),0 4px 12px rgba(150,110,150,.15);transition:box-shadow .2s;position:relative}
.bgt.on{color:var(--ink)}
.bgt.on i{box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--acc)}
.bgt i em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.sub-opt{padding:4px 0 14px}
.sub-opt .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
.look-row{padding:14px 0}
.look-row+.look-row{border-top:1px dashed rgba(200,170,200,.45)}
.look-row .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
.preview-btn{display:flex;align-items:center;gap:12px;margin-top:14px}
.preview-btn .fake{flex:1;height:42px;border-radius:14px;background:var(--grad);box-shadow:0 4px 12px var(--acc-glow);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.preview-btn .fake2{flex:1;height:42px;border-radius:14px;border:1.5px dashed var(--acc-line);color:var(--acc-text);font-weight:700;display:grid;place-items:center;font-size:14px}
.jars2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jars2 button{background:rgba(255,255,255,.55);border-radius:18px;padding:10px 6px 10px;font-weight:600;font-size:13px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 0 1px #fff}
.jars2 button.on{color:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--acc)}
.jars2 svg{width:100%;max-width:92px;height:auto}
.tiny{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}

/* нижнее меню */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;
  display:flex;gap:2px;padding:6px;border-radius:24px;width:min(440px,calc(100% - 24px));
  background:rgba(255,250,248,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:8px 2px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);transition:background .2s;min-width:0}
.tabs button.on{background:var(--acc-soft);color:var(--ink)}
.tabs svg{width:22px;height:22px}

/* шторка */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(90,68,102,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.overlay.open{opacity:1}
.overlay.stacked{background:rgba(90,68,102,.1);backdrop-filter:none;-webkit-backdrop-filter:none}
.sheet{width:100%;max-width:460px;max-height:min(88vh,100%);overflow:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,#FCF4F5,#F8F3FA);border-radius:28px 28px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(150,100,140,.2)}
.overlay.open .sheet{transform:none}

function fresh(){return {v:1,ts:0,dirs:[],stable:[{id:'eyes',name:'Зарядка для глаз',color:STABLE_COLOR}],weeks:{},lastWeek:null,carry:[],log:{},seq:[],days:{},jars:[],pins:{items:[]},fun:{seq:[],log:{}},

  const tk=today();

function colorOf(k){const d=dirById(k);if(d)return d.color;if(String(k).startsWith('j:')){const j=jarById(k.slice(2));return j?j.color:ONE_COLOR}if(k==='one')return ONE_COLOR;const s=stableById(k);return s?s.color:STABLE_COLOR}

function hexRgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return [n>>16&255,n>>8&255,n&255]}

/* ================= хранение: устройство + облако Telegram ================= */
// Как в Designdar: каждое изменение сразу сохраняется на устройстве — мгновенно и без потерь при закрытии,
// а следом уходит в облако Telegram, чтобы данные были одинаковыми на всех устройствах.
// Облако проверяется при каждом открытии: если там версия новее, а на этом устройстве нет неотправленных
// изменений, берётся облачная — поэтому старая копия больше не затирает новую.
// В облаке четыре ячейки-версии и указатель «h». Новая версия пишется в свободную ячейку по одному куску,
// указатель переключается только после полной записи. Три прошлые версии остаются в облаке как запас.
const HEAD='h', SLOTS=4, CHUNK_BYTES=4000, MAX_CHUNKS=240, SYNC_LS='starjar-sync';
let ready=false, head=null, baseRev=0, pending=false, cloudChecked=false, pushing=false, pushT=null, retryT=null,
    syncErr=false, lastSync=0, suppress=false, bootDirty=false, lsWarned=false;

const cs=()=>TG.CloudStorage;
function cGet(k){return new Promise((ok,no)=>{try{cs().getItem(k,(e,v)=>e?no(e):ok(v))}catch(x){no(x)}})}
function cSet(k,v){return new Promise((ok,no)=>{try{cs().setItem(k,v,(e,r)=>e||r===false?no(e||'set'):ok())}catch(x){no(x)}})}
function cDel(keys){return new Promise((ok,no)=>{if(!keys.length)return ok();try{cs().removeItems(keys,(e)=>e?no(e):ok())}catch(x){no(x)}})}
async function cGetMany(keys){
  const out={};
  for(let i=0;i<keys.length;i+=50){
    const part=keys.slice(i,i+50);
    const v=await new Promise((ok,no)=>{try{cs().getItems(part,(e,r)=>e||!r?no(e||'get'):ok(r))}catch(x){no(x)}});
    Object.assign(out,v);
  }
  return out;
}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no('timeout'),ms))])}
// режем по байтам, а не по символам: русская буква занимает 2 байта, а сервер Telegram может считать лимит в байтах
function splitChunks(str){
  const out=[]; let start=0, bytes=0;
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i), pair=c>=0xD800&&c<=0xDBFF&&i+1<str.length, b=c<0x80?1:c<0x800?2:pair?4:3;
    if(bytes+b>CHUNK_BYTES){out.push(str.slice(start,i));start=i;bytes=0}
    bytes+=b; if(pair) i++;
  }
  out.push(str.slice(start)); return out;
}
const ck=(slot,i)=>'s'+slot+'_'+i;
const BROKEN='broken';

async function readHead(){
  const v=await cGet(HEAD); if(!v) return null;
  let h; try{h=JSON.parse(v)}catch(e){throw BROKEN}
  if(!h||typeof h.rev!=='number'||!h.slots) throw BROKEN;
  return h;
}
async function readSlot(h,slot){
  const m=h.slots[slot]; if(!m||!m.n) throw BROKEN;
  const keys=Array.from({length:m.n},(_,i)=>ck(slot,i));
  const vals=await cGetMany(keys), str=keys.map(k=>vals[k]||'').join('');
  if(m.len!=null&&str.length!==m.len) throw BROKEN;
  try{return JSON.parse(str)}catch(e){throw BROKEN}
}
// свежая версия, а если она повреждена — самая свежая из целых
async function readBest(h){
  const order=[h.cur,...Object.keys(h.slots).map(Number).filter(i=>i!==h.cur).sort((a,b)=>h.slots[b].rev-h.slots[a].rev)];
  for(const i of order){try{return {s:await readSlot(h,i),fallback:i!==h.cur}}catch(e){if(e!==BROKEN)throw e}}
  throw 'all-broken';
}
// облако самого первого формата (до ячеек) — читается один раз при переходе; сами старые ключи не трогаем
async function readLegacy(){
  const n=parseInt(await cGet('n'),10); if(!n) return null;
  const keys=Array.from({length:n},(_,i)=>'c'+i), vals=await cGetMany(keys);
  try{const s=JSON.parse(keys.map(k=>vals[k]||'').join(''));return s&&s.v===1?s:null}catch(e){return null}
}

/* --- устройство --- */
function readLocal(){
  let s=null, m={};
  try{s=JSON.parse(localStorage.getItem(LS))}catch(e){}
  try{m=JSON.parse(localStorage.getItem(SYNC_LS))||{}}catch(e){}
  return {s:s&&s.v===1?s:null, baseRev:m.baseRev||0, pending:!!m.pending};
}
function writeMeta(){try{localStorage.setItem(SYNC_LS,JSON.stringify({baseRev,pending}))}catch(e){}}
function writeLocal(){
  try{localStorage.setItem(LS,JSON.stringify(state))}
  catch(e){if(!lsWarned){lsWarned=true;toast(CLOUD?'Память устройства переполнена — сохраняю только в облако':'Память устройства переполнена — изменения могут не сохраниться')}}
  writeMeta();
}

/* --- сохранение --- */
function save(){
  if(!ready||!state) return;
  if(suppress){bootDirty=true;return}
  state.ts=Date.now(); pending=true; writeLocal();
  if(CLOUD&&cloudChecked){clearTimeout(pushT);pushT=setTimeout(push,600)}
}
async function push(){
  clearTimeout(pushT); clearTimeout(retryT);
  if(!CLOUD||!cloudChecked||pushing||!pending) return;
  pushing=true;
  const str=JSON.stringify(state), ch=splitChunks(str), startTs=state.ts;
  try{
    if(ch.length>MAX_CHUNKS) throw 'too-big';
    const h=(await withTimeout(readHead(),10000))||{cur:-1,rev:0,slots:{}};
    const slot=((h.cur+1)%SLOTS+SLOTS)%SLOTS, old=h.slots[slot]; // никогда не пишем в текущую ячейку
    for(let i=0;i<ch.length;i++) await withTimeout(cSet(ck(slot,i),ch[i]),12000); // по одному куску — Telegram так надёжнее
    const now=Date.now(), rev=h.rev+1;
    const nh={cur:slot,rev,ts:now,slots:Object.assign({},h.slots,{[slot]:{n:ch.length,len:str.length,rev,ts:now,stars:(state.seq||[]).length}})};
    await withTimeout(cSet(HEAD,JSON.stringify(nh)),12000);
    if(old&&old.n>ch.length) cDel(Array.from({length:old.n-ch.length},(_,i)=>ck(slot,ch.length+i))).catch(()=>{});
    head=nh; baseRev=rev; lastSync=now; syncErr=false;
    if(state.ts===startTs) pending=false; // пока отправляли, ничего не изменилось
    writeMeta();
  }catch(e){
    syncErr=true;
    if(e==='too-big') toast('Данных стало больше, чем вмещает облако Telegram — сохраняю только на устройстве');
    else retryT=setTimeout(push,8000);
  }
  pushing=false;
  if(pending&&!syncErr){clearTimeout(pushT);pushT=setTimeout(push,600)}
}

/* --- синхронизация --- */
function quietEnsure(){
  suppress=true;
  try{ensureWeek();ensureDay();applyRelock();if(state.pins&&state.pins.items.some(i=>i.done)){unpinDone();bootDirty=true}}
  finally{suppress=false}
}
function adopt(s,h,fallback){
  state=normalize(s); if(h){head=h;baseRev=h.rev} pending=false; ready=true; bootDirty=false;
  writeLocal(); quietEnsure(); applyTheme(); render();
  if(bootDirty){bootDirty=false;save()}
  if(fallback) toast('Последняя версия в облаке повреждена — открыла предыдущую целую');
}
// сверка с облаком при открытии: чья версия главнее
async function reconcile(){
  if(!CLOUD) return false;
  try{
    const h=await withTimeout(readHead(),10000);
    if(h){
      if(!state||(h.rev>baseRev&&!pending)){
        const r=await withTimeout(readBest(h),25000);
        if(state&&pending) head=h;          // пока загружалось, ты что-то изменила — твоё главнее
        else adopt(r.s,h,r.fallback);
      } else head=h;
    } else {
      head={cur:-1,rev:0,slots:{}}; baseRev=0;
      const legacy=await withTimeout(readLegacy(),20000);
      if(legacy&&(!state||(!pending&&(legacy.ts||0)>(state.ts||0)))) adopt(legacy,null);
      else if(!state) adopt(null,null);
      pending=true; writeMeta();            // заводим указатель в облаке
    }
    cloudChecked=true; syncErr=false; lastSync=Date.now();
    if(pending){clearTimeout(pushT);pushT=setTimeout(push,300)}
    return true;
  }catch(e){syncErr=true;return false}
}
function busyUI(){return !!document.querySelector('.overlay')||(typeof dragActive!=='undefined'&&dragActive)}
// изменения, сделанные на другом устройстве
async function pull(){
  if(!ready||!CLOUD) return false;
  if(!cloudChecked){await reconcile();return false}
  if(pushing||pending||busyUI()) return false;
  try{
    const h=await withTimeout(readHead(),10000);
    if(!h||h.rev<=baseRev){lastSync=Date.now();syncErr=false;return false}
    const r=await withTimeout(readBest(h),25000);
    if(pending||pushing||busyUI()) return false;
    adopt(r.s,h,r.fallback); return true;
  }catch(e){syncErr=true;return false}
}

/* ================= логика недели и дня ================= */
function isDaily(d){return !!d&&d.freq==='day'}
function mkItem(dir,name,prog,pid,pi){const o={id:uid(),dir:dir||null,name,prog:!!prog,done:false,doneOn:null};if(pid){o.pid=pid;o.pi=pi||null}return o}
// режим «Только несделанное»: выполненное остаётся в программе с пометкой doneAt и больше не приходит
function isOnce(p){return !!p&&p.mode==='once'}
function active(p){return isOnce(p)?p.items.filter(x=>!x.doneAt):p.items}
function progItemFor(p,i){return p&&p.items.find(x=>i.pi?x.id===i.pi:x.name===i.name)}
function linkedProgItem(i){
  if(!i.prog||!i.dir) return null; const d=dirById(i.dir); if(!d) return null;
  const cands=i.pid?[progOf(d.id,i.pid)]:[progOf(d.id,curWeek().progs[d.id]),datedFor(d,today())];
  for(const p of cands) if(isOnce(p)){const x=progItemFor(p,i); if(x) return x}
  return null;
}
function curDay(){return state.days[today()]}
function isDated(p){return !!(p&&p.status==='dates'&&p.from&&p.to)}
function cyc(d){return d.progs.filter(p=>(p.status||'queue')==='queue')}
// закреплённая программа направления: включается каждую неделю, очередь при этом стоит на месте
function lockOf(d){return (d&&d.lock&&cyc(d).find(p=>p.id===d.lock))||null}
function datedFor(d,date){return d.progs.find(p=>isDated(p)&&p.from<=date&&date<=p.to)}
function fmtD(k){const [y,m,dd]=k.split('-').map(Number);return dd+' '+MON[m-1]}
function skipOf(d){const w=curWeek();return (w.skip&&w.skip[d.id])||[]}
function dayProg(d,date){const dp=datedFor(d,date);if(dp)return dp;if(isDaily(d))return progOf(d.id,curWeek().progs[d.id]);return null}
// «Только несделанное»: выполненное живёт в самой программе и возвращается на главный при каждом её включении
function restoreDone(list,d,p){
  if(!list||!isOnce(p)) return;
  p.items.forEach(x=>{
    if(!x.doneAt) return;
    if(list.items.some(i=>i.dir===d.id&&i.pid===p.id&&(i.pi?i.pi===x.id:i.name===x.name))) return;
    const o=mkItem(d.id,x.name,1,p.id,x.id); o.done=true; o.doneOn=x.doneAt; list.items.push(o);
  });
}
// выполненное, которое в программе вернули ↺ или очистили, уходит и с главного
function dropStaleDone(list,d,p){
  if(!list||!isOnce(p)) return;
  list.items=list.items.filter(i=>!(i.dir===d.id&&i.pid===p.id&&i.done&&!i.hidden&&!(progItemFor(p,i)||{}).doneAt));
}
// убрать выполненное с главного = убрать его и из «Выполнено» программы (это один общий список)
function forgetDone(i){
  const x=linkedProgItem(i); if(!x||!x.doneAt) return;
  const d=dirById(i.dir), p=d&&d.progs.find(q=>q.items.includes(x));
  if(p) p.items=p.items.filter(y=>y!==x);
}
function progItems(d,p){const sk=skipOf(d);return active(p).filter(it=>!sk.includes(it.name)).map(it=>mkItem(d.id,it.name,1,p.id,it.id))}
function refreshToday(d){
  const t=curDay(); if(!t) return;
  dropUndone(t,d.id);
  const p=dayProg(d,today()); if(!p) return;
  dropStaleDone(t,d,p);
  const done=new Set(t.items.filter(i=>i.dir===d.id&&i.prog).map(i=>i.name));
  progItems(d,p).forEach(x=>{if(!done.has(x.name))t.items.push(x)});
  restoreDone(t,d,p);
}
function startProgram(w,dir,idx,toToday){
  const list=cyc(dir), p=list[idx]; if(!p) return;
  w.progs[dir.id]=p.id;
  if(isDaily(dir)){if(toToday) refreshToday(dir)}
  else{
    const has=new Set(w.items.filter(i=>i.dir===dir.id).map(i=>i.name));
    active(p).forEach(it=>{if(!has.has(it.name)){has.add(it.name);w.items.push(mkItem(dir.id,it.name,1,p.id,it.id))}});
    if(!isOnce(p)) (p.carry||[]).forEach(n=>{if(!has.has(n)){has.add(n);w.items.push(mkItem(dir.id,n,1,p.id))}});
    p.carry=[];
    restoreDone(w,dir,p);
  }
  dir.next=(idx+1)%list.length;
}
// невыполненные дела программы ждут её следующего включения
function stashUndone(w,d){
  if(!w||!d||isDaily(d)) return;
  const p=progOf(d.id,w.progs&&w.progs[d.id]); if(!p) return false;
  if(isOnce(p)) return true;
  p.carry=p.carry||[];
  w.items.forEach(i=>{if(i.dir===d.id&&i.prog&&!i.done&&!p.carry.includes(i.name))p.carry.push(i.name)});
  return true;
}
function sameIn(list,dir,name){return list.some(x=>(x.dir||null)===(dir||null)&&x.name===name)}
function ensureWeek(){
  const key=weekKey();
  if(state.weeks[key]) return;
  const prev=state.lastWeek?state.weeks[state.lastWeek]:null;

      if(i.done) return;

    if(i.done||i.prog||sameIn(items,i.dir,i.name)) return; // дела программы и так придут по программе

      if(items.length||(own&&cyc(d).length)||(kind==='day'&&datedFor(d,today()))) g.push(groupHTML(d,items,w,kind,own));
    });
    state.jars.forEach(j=>{const it=list.items.filter(i=>i.jar===j.id&&!i.hidden);if(it.length)g.push(groupHTML(jarAsDir(j),it,w,kind,false))});
    const misc=list.items.filter(i=>(!i.dir||!dirById(i.dir))&&!(i.jar&&jarById(i.jar))&&!i.hidden);
    if(misc.length) g.push(groupHTML(null,misc,w,kind,false));
    return g;
  };
  const locked=[];
  const dg=build('day',day), wg=build('week',w), pg=build('pin',state.pins);
  h+=pinsHTML();
  locked.forEach(({d,items,kind})=>{const lk=lockOf(d);h+=`<div class="sec-title lock-title"><span>${esc(lk.name)}</span><button class="link" data-a="switch" data-id="${d.id}">${esc(d.name)} · сменить</button></div><div class="card">${groupHTML(d,items,w,kind,true,true)}</div>`});
  if(!sg&&!locked.length&&!dg.length&&!wg.length&&!pg.length){
    h+=`<div class="sec-title">Сегодня</div><div class="card"><div class="hint-empty">Пока здесь пусто.<br>Заведи направления и программы во вкладке «Программы» — и план соберётся сам.</div></div>`;
  }
  if(sg||dg.length) h+=`<div class="sec-title">Сегодня</div><div class="card">${sg}${dg.join('')}</div>`;
  if(wg.length) h+=`<div class="sec-title">Эта неделя <small>${weekLabel()}</small></div><div class="card">${wg.join('')}</div>`;
  h+=`<button class="add-btn" data-a="addOne">+ Добавить дело</button>`;
  h+=soonHTML();
  return h;
}
// к какой программе относится выполненное дело ('' — дело вне программ)
function doneBucket(i){return i.pid&&i.dir&&progOf(i.dir,i.pid)?i.pid:''}
function groupHTML(d,items,w,kind,own,noHead){
  const color=d?d.color:ONE_COLOR;
  // включённая сейчас программа направления: на ней фокус — её название в заголовке и только её «Выполнено»
  let fp=null;
  if(d&&d.progs&&d.progs.length){
    if(kind==='day') fp=dayProg(d,today())||null;
    else if(kind==='week'&&own) fp=progOf(d.id,w.progs[d.id])||null;
  }
  let gtitle, gright='';
  if(d){
    const dp=kind==='day'&&datedFor(d,today());
    const p=progOf(d.id,w.progs[d.id]);
    let right;
    if(fp){
      right=dp?`<span class="tag">${esc(d.name)} · до ${fmtD(dp.to)}</span>`
        :(own&&cyc(d).length?`<button class="link" data-a="switch" data-id="${d.id}">${esc(d.name)} · сменить</button>`
        :`<span class="tag">${esc(d.name)}</span>`);
    } else {
      right=dp?`<span class="tag">${esc(dp.name)} · до ${fmtD(dp.to)}</span>`
        :(own&&cyc(d).length?`<button class="link" data-a="switch" data-id="${d.id}">${p?esc(p.name)+' · сменить':'выбрать программу'}</button>`:'');
    }
    gtitle=esc(fp?fp.name:d.name)+(fp&&d.lock===fp.id?`<span class="gpin" title="Закреплена">${PIN(1)}</span>`:''); gright=right;
  } else gtitle='Разное';
  const row=i=>`<div class="item${i.done?' done':' drag-item'}" data-id="${i.id}">
      <button class="tick" data-a="toggle" data-id="${i.id}" aria-label="Отметить"></button>
      <span class="iname" data-a="toggle" data-id="${i.id}">${esc(i.name)}${prSmall(i)}</span>
      <button class="more" data-a="menu" data-id="${i.id}" aria-label="Ещё">●●●</button></div>`;
  const und=items.filter(i=>!i.done), dn=items.filter(i=>i.done);
  let body=und.length?`<div class="ilist" data-k="${kind}">${und.map(row).join('')}</div>`:'';
  // у каждой программы — свой список «Выполнено», чтобы дела разных книг не смешивались
  const buckets=new Map();
  if(d&&d.progs) d.progs.forEach(p=>buckets.set(p.id,[]));
  buckets.set('',[]);
  dn.forEach(i=>buckets.get(doneBucket(i)).push(i));
  // когда программа включена — показываем только её выполненное (остальное не удаляется, просто не видно)
  const used=[...buckets].filter(([b,l])=>l.length&&(!fp||b===fp.id));
  used.forEach(([b,l])=>{
    const label='Выполнено';
    const fk=kind+':'+(d?d.id:'misc')+(b?':'+b:''), fo=isFolded(fk)?' folded':'';
    body+=`<div class="dhead${fo}"><button class="dtoggle" data-a="fold" data-k="${fk}" aria-label="Свернуть или развернуть"><span class="chev-s">▾</span><span class="dlabel">${label} · ${l.length}</span></button><button class="link" data-a="clearDone" data-k="${kind}" data-d="${d?d.id:''}" data-p="${b}">Очистить</button></div><div class="dwrap${fo}"><div class="dlist">${l.map(row).join('')}</div></div>`;
  });
  if(d&&!items.length){
    if(own&&!w.progs[d.id]&&cyc(d).length&&!(kind==='day'&&datedFor(d,today()))){
      const nx=cyc(d)[(d.next||0)%cyc(d).length];
      body=`<div class="nodir">На этой неделе программы пока нет<br><button class="pill" data-a="startNext" data-id="${d.id}">Начать «${esc(nx.name)}»</button></div>`;
    } else body=`<div class="nodir">${kind==='day'?'На сегодня свободно':'Пока пусто'}</div>`;
  } else if(d&&!body) body=`<div class="nodir">${kind==='day'?'На сегодня свободно':'Пока пусто'}</div>`;
  // тап по названию сворачивает список группы; состояние хранится вместе с остальными свёрнутыми списками
  if(noHead) return `<div class="group" style="--c:${color}">${body}</div>`; // заголовок уже стоит над карточкой
  const gk='grp:'+kind+':'+(d?d.id:'misc'), gf=isFolded(gk)?' folded':'';
  const head=`<div class="ghead${gf}"><button class="gname gtoggle" data-a="gfold" data-k="${gk}" aria-label="Свернуть или развернуть">${dot(color)}<span class="gtitle">${gtitle}</span><span class="gcnt">${und.length?'· '+und.length:''}</span><span class="chev-s">▾</span></button>${gright}</div>`;
  return `<div class="group" style="--c:${color}">${head}<div class="dwrap gwrap${gf}"><div>${body}</div></div></div>`;
}

function sortableGrid(box,itemSel,done){

    const item=e.target.closest(itemSel); if(!item||item.parentElement!==box) return;
    const items=()=>[...box.children].filter(x=>x.matches(itemSel));
    if(items().length<2) return;
    const sx=e.clientX, sy=e.clientY; let started=false, timer, bx=sx, by=sy;
    const cleanup=()=>{clearTimeout(timer);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
    const start=()=>{started=true;dragActive=true;item.classList.add('dragging');haptic('medium')};
    const place=ev=>{item.style.transform=`translate(${ev.clientX-bx}px,${ev.clientY-by}px)`};
    const move=ev=>{
      if(!started){if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8)cleanup();return}
      ev.preventDefault(); place(ev);

    };

      cleanup(); if(!started) return;

      setTimeout(()=>{item.classList.remove('dragging','drag-anim');done(items().map(x=>x.dataset.id))},190);
    };

    window.addEventListener('pointercancel',cancel);
  });

function renderStats(){
  const total=state.seq.length, full=Math.floor(total/CAP), wk=weekKey(), t=today(), mo=t.slice(0,7);
  const sum=(pred,key,log)=>{let s=0;const L=log||state.log;for(const d in L){if(!pred(d))continue;const o=L[d];if(key)s+=o[key]||0;else for(const k in o)s+=o[k]}return s};
  const inWeek=d=>d>=wk&&d<=t, inMonth=d=>d.slice(0,7)===mo, all=()=>true;
  let h=`<header class="top"><h1>Статистика</h1><div class="date">Здесь считается только то, что сделано</div></header>`;
  h+=`<div class="sec-title">Звёзды</div><div class="tiles">
    <div class="card"><div class="tile-v">${total}</div><div class="tile-l">всего</div></div>
    <div class="card"><div class="tile-v">${full}</div><div class="tile-l">${pl(full,'полная банка','полные банки','полных банок')}</div></div>
    <div class="card"><div class="tile-v">${sum(inWeek)}</div><div class="tile-l">на этой неделе</div></div>
    <div class="card"><div class="tile-v">${sum(inMonth)}</div><div class="tile-l">в этом месяце</div></div></div>`;
  if(state.stable.length){
    h+=`<div class="sec-title">Каждый день</div>`+state.stable.map(s=>`<div class="card" style="padding:14px 16px">
      <div class="gname">${dot(s.color)}${esc(s.name)}</div>
      <div class="mini3"><div><b>${sum(inWeek,s.id)}</b><span>за неделю</span></div><div><b>${sum(inMonth,s.id)}</b><span>за месяц</span></div><div><b>${sum(all,s.id)}</b><span>всего</span></div></div></div>`).join('');
  }
  const rows=state.dirs.map(d=>({name:d.name,c:d.color,all:sum(all,d.id),m:sum(inMonth,d.id)}));
  state.jars.forEach(j=>{const k='j:'+j.id,a=sum(all,k)+sum(all,k,state.fun.log);if(a)rows.push({name:j.name,c:j.color,all:a,m:sum(inMonth,k)+sum(inMonth,k,state.fun.log)})});
  const oneAll=sum(all,'one'); if(oneAll) rows.push({name:'Разное',c:ONE_COLOR,all:oneAll,m:sum(inMonth,'one')});
  if(rows.length){
    const max=Math.max(1,...rows.map(r=>r.all));
    h+=`<div class="sec-title">По направлениям</div><div class="card">`+rows.map(r=>`
      <div class="bar-row" style="--c:${r.c}"><div class="bar-top"><span>${esc(r.name)}</span><span>${r.all}</span></div>
      <div class="bar"><i style="width:${r.all?Math.max(4,r.all/max*100):0}%"></i></div>
      <div class="bar-sub">в этом месяце — ${r.m}</div></div>`).join('')+`</div>`;
  }
  const fin=[];state.dirs.forEach(d=>d.progs.forEach(p=>{if(p.status==='done')fin.push({d,p})}));
  if(fin.length){
    fin.sort((a,b)=>(a.p.doneOn||'')<(b.p.doneOn||'')?1:-1);
    h+=`<div class="sec-title">Завершённые программы</div><div class="card">`+fin.map(({d,p})=>{const n=(state.pstars||{})[p.id]||0;return `<div class="frow">${dot(d.color)}<div class="ftxt"><div class="fname">${esc(p.name)}</div><div class="small">${esc(d.name)} · <button class="link" data-a="unfinish" data-d="${d.id}" data-p="${p.id}">вернуть</button></div></div><div class="fstars"><b>${n}</b><span>${pl(n,'звезда','звезды','звёзд')}</span></div></div>`}).join('')+`</div>`;
  }
  h+=`<p class="note">каждая звёздочка остаётся с тобой</p>`;
  return h;
}

/* ================= экран «Программы» ================= */
function progStatus(d,p){
  const t=today(), w=curWeek(), st=p.status||'queue';
  if(st==='off') return {txt:'на паузе',cls:'off'};
  if(st==='done') return {txt:'завершена',cls:'off'};
  if(st==='dates'){
    if(!p.from||!p.to) return {txt:'даты не выбраны',cls:'off'};
    if(p.from<=t&&t<=p.to) return {txt:'сейчас · до '+fmtD(p.to),cls:'now'};
    if(p.to<t) return {txt:'даты прошли',cls:'off'};
    return {txt:fmtD(p.from)+' — '+fmtD(p.to),cls:''};
  }
  const lk=lockOf(d);
  if(w.progs[d.id]===p.id&&!datedFor(d,t)) return {txt:lk===p?'сейчас · закреплена':'сейчас',cls:'now'};
  if(lk) return {txt:lk===p?'закреплена':'по очереди',cls:''};
  const cl=cyc(d), nx=cl.length?cl[(d.next||0)%cl.length]:null;
  return {txt:nx===p?'следующая':'по очереди',cls:''};
}

function colorField(id,val,list){
  const custom=!list.map(x=>x.toLowerCase()).includes(String(val).toLowerCase());
  return `<div class="swatches" data-cf="${id}">${list.map(c=>`<button type="button" data-c="${c}" style="--c:${c}" class="${c.toLowerCase()===String(val).toLowerCase()?'on':''}" aria-label="Цвет"></button>`).join('')}
    <label class="sw-own${custom?' on':''}" style="--c:${custom?val:'#ffffff'}" aria-label="Свой цвет"><input type="color" value="${esc(val)}"></label></div>`;
}
function bindColor(el,id,cb){
  const box=el.querySelector(`[data-cf="${id}"]`); if(!box) return;
  const own=box.querySelector('.sw-own'), inp=own.querySelector('input');
  const mark=t=>box.querySelectorAll('[data-c],.sw-own').forEach(x=>x.classList.toggle('on',x===t));
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{mark(b);cb(b.dataset.c)});
  inp.oninput=inp.onchange=()=>{own.style.setProperty('--c',inp.value);mark(own);cb(inp.value)};
}

document.getElementById('photoIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const m=1400, s=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let url=c.toDataURL('image/jpeg',.82);
      try{localStorage.setItem(PHOTO_LS,url)}catch(x){
        url=c.toDataURL('image/jpeg',.6);
        try{localStorage.setItem(PHOTO_LS,url)}catch(y){toast('Фото не сохранится после закрытия — оно слишком большое')}
      }
      photo=url; state.theme.bg='photo'; save(); applyTheme(); render();
    };
    img.onerror=()=>toast('Не получилось открыть это фото');
    img.src=r.result;
  };
  r.readAsDataURL(f);
});

const JAR_PH='starjar-jarph-', jarPh={};
function jarPhoto(id){if(!(id in jarPh)){try{jarPh[id]=localStorage.getItem(JAR_PH+id)||''}catch(e){jarPh[id]=''}}return jarPh[id]}
function setJarPhoto(id,url){jarPh[id]=url||'';try{if(url)localStorage.setItem(JAR_PH+id,url);else localStorage.removeItem(JAR_PH+id)}catch(e){toast('Фото не сохранится после закрытия — оно слишком большое')}}
function readPhoto(f,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{const m=900,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};
    img.onerror=()=>toast('Не получилось открыть это фото'); img.src=r.result};
  r.readAsDataURL(f);
}
const phSrc={};
function srcOf(data){
  if(!data) return ''; if(phSrc[data]) return phSrc[data];
  try{const i=data.indexOf(','),mime=(data.slice(0,i).match(/:(.*?);/)||[])[1]||'image/jpeg',bin=atob(data.slice(i+1)),a=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);
    return phSrc[data]=URL.createObjectURL(new Blob([a],{type:mime}))}catch(e){return data}
}

/* ================= прогресс идей из копилок ================= */
// Хранится в самой идее копилки (x.pr): единица, сколько уже и (по желанию) сколько всего.
// Никаких дат и подсчёта дней — только где ты сейчас. За каждую отметку — одна звезда в баночку копилок.
// Хранится в самой идее копилки (x.pr). Единицы: страницы и серии.
const PR_U={p:{n:'Страницы',w:'стр.',all:'Всего страниц',now:'Уже прочитано страниц'},
            s:{n:'Серии',w:'серия',all:'Всего серий',now:'Уже просмотрено серий'}};
function prU(pr){return PR_U[pr.u]||PR_U.p} // счётчик глав убран — если где-то остался, он считается страницами
function prDone(pr){return !!(pr.t&&pr.n>=pr.t)}
function prText(pr){return prU(pr).w+' '+pr.n+(pr.t?' из '+pr.t:'')}
function prSmall(i){const x=i.jar&&jarItemOf(i);return x&&x.pr?` <small class="ipr">· ${esc(prText(x.pr))}</small>`:''}
function num(v){const n=parseInt(String(v).replace(/\D/g,''),10);return isNaN(n)?null:n}
function prMark(it,x,amount){
  const pr=x.pr, before=pr.n; let n=before+amount; if(pr.t) n=Math.min(n,pr.t);
  const a=n-before; if(a<=0) return false;
  const k='j:'+it.jar, d=today();
  pr.n=n; pr.last={a,k,d}; addFunStar(k,d); haptic('light'); return true;
}
// дошла до конца — идея сама отмечается выполненной и уходит в «Выполнено»
function prFinishIfDone(it,x){
  if(!prDone(x.pr)) return false;
  const id=it.id; render();
  const el=document.querySelector(`.stk[data-id="${id}"]`); if(el) el.classList.add('bye');
  setTimeout(()=>{toggleItem(id);toast((x.pr.u==='s'?'Досмотрела':'Дочитала')+' до конца — идея в «Выполнено»')},el?330:0);
  return true;
}
function prAddSheet(id){
  const f=findItem(id); if(!f) return; const it=f.it, x=jarItemOf(it); if(!x||!x.pr) return;
  let mode='add';
  sheet(esc(it.name),`
    <div class="field"><div class="seg" id="pa-m"><button type="button" data-m="add" class="on">Прочитала</button><button type="button" data-m="at">Я на странице</button></div></div>
    <div class="field"><input type="text" inputmode="numeric" id="pa-v" placeholder="Сколько страниц" autocomplete="off"><div class="explain" id="pa-x"></div></div>
    <button class="btn main" id="pa-ok">Отметить</button>`,(el,close)=>{
    const inp=el.querySelector('#pa-v'), ex=el.querySelector('#pa-x');
    const upd=()=>{el.querySelectorAll('#pa-m button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
      inp.placeholder=mode==='add'?'Сколько страниц':'Номер страницы';

        else if(v<x.pr.n){x.pr.n=v;delete x.pr.last;save();close();render();toast('Теперь '+prText(x.pr));return}
        else return close();
      }

    };

function prSheet(id){
  const f=findItem(id); if(!f) return; const it=f.it, x=jarItemOf(it); if(!x) return;
  const had=!!x.pr, dr={u:had&&PR_U[x.pr.u]?x.pr.u:'p'};
  sheet('Прогресс',`
    <div class="field"><label class="t">Что считать</label><div class="seg" id="pr-u">${Object.entries(PR_U).map(([k,u])=>`<button type="button" data-u="${k}">${u.n}</button>`).join('')}</div></div>
    <div class="field"><label class="t" id="pr-tl"></label><input type="text" inputmode="numeric" id="pr-t" placeholder="Можно не указывать" autocomplete="off" value="${had&&x.pr.t?x.pr.t:''}"></div>

      <div class="explain">Звезда в баночку копилок — за каждую отметку на карточке, сколько бы ты ни прочитала или ни посмотрела. Здесь цифры просто поправляются, звёзд за это нет.</div></div>
    <button class="btn main" id="pr-ok">${had?'Сохранить':'Начать отмечать'}</button>
    ${had&&x.pr.last?`<button class="btn soft" id="pr-undo">Отменить последнюю отметку (+${x.pr.last.a})</button>`:''}
    ${had?'<button class="btn danger" id="pr-del">Убрать прогресс</button>':''}`,(el,close)=>{
    const upd=()=>{el.querySelectorAll('#pr-u button').forEach(b=>b.classList.toggle('on',b.dataset.u===dr.u));
      el.querySelector('#pr-tl').textContent=PR_U[dr.u].all; el.querySelector('#pr-nl').textContent=PR_U[dr.u].now};
    upd();
    el.querySelectorAll('#pr-u button').forEach(b=>b.onclick=()=>{dr.u=b.dataset.u;upd();haptic('light')});

      const t=num(el.querySelector('#pr-t').value)||null; let n=num(el.querySelector('#pr-n').value)||0;
      if(t&&n>t) n=t;

    };
    const un=el.querySelector('#pr-undo');
    if(un) un.onclick=()=>{const L=x.pr.last;removeFunStar(L.k,L.d);x.pr.n=Math.max(0,x.pr.n-L.a);delete x.pr.last;save();close();render();toast('Отметка отменена · '+prText(x.pr))};
    const del=el.querySelector('#pr-del');
    if(del) confirmBtn(del,'Нажми ещё раз — счётчик пропадёт, звёзды останутся',()=>{delete x.pr;save();close();render()});
  });

/* ================= шторки ================= */
/* ===== клавиатура: шторка всегда в видимой части экрана, фон под ней не ездит ===== */
const VV=window.visualViewport;
function fitOverlays(){
  const os=document.querySelectorAll('.overlay'); if(!os.length) return;
  const h=VV?VV.height:window.innerHeight, top=VV?VV.offsetTop:0, kb=window.innerHeight-h>120;
  os.forEach(o=>{o.style.top=top+'px';o.style.height=h+'px';o.style.bottom='auto';o.classList.toggle('kb',kb)});
}
if(VV){VV.addEventListener('resize',fitOverlays);VV.addEventListener('scroll',fitOverlays)}
let lockY=null;
function lockScroll(){if(lockY!==null)return;lockY=window.scrollY;const b=document.body.style;b.position='fixed';b.top=-lockY+'px';b.left='0';b.right='0'}
function unlockScroll(){if(lockY===null)return;const b=document.body.style;b.position=b.top=b.left=b.right='';window.scrollTo(0,lockY);lockY=null}
// прокручиваем только саму шторку — страница и окно Telegram остаются на месте
function keepVisible(t,smooth=true){
  const sc=t&&t.closest('.sheet'); if(!sc) return;
  const box=t.closest('.ex-add')||t, r=box.getBoundingClientRect(), s=sc.getBoundingClientRect(), pad=14;
  let d=0; if(r.bottom>s.bottom-pad) d=r.bottom-s.bottom+pad; else if(r.top<s.top+pad) d=r.top-s.top-pad;
  if(d) sc.scrollTo({top:sc.scrollTop+d,behavior:smooth?'smooth':'auto'});
}
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input,textarea')&&t.closest('.sheet'))setTimeout(()=>{if(document.activeElement===t)keepVisible(t)},350)});

function sheet(title,body,mount,onClose){
  const o=document.createElement('div');o.className='overlay'+(document.querySelector('.overlay')?' stacked':'');
  o.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div><h3${String(title).replace(/<[^>]*>/g,'').length>70?' class="long"':''}>${title}</h3>${body}</div>`;
  lockScroll(); document.body.appendChild(o); fitOverlays();
  requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('open')));
  let closed=false;
  const close=()=>{if(closed)return;closed=true;o.classList.remove('open');setTimeout(()=>{o.remove();if(!document.querySelector('.overlay'))unlockScroll()},280);onClose&&onClose()};
  o.addEventListener('click',e=>{if(e.target===o)close()});
  mount&&mount(o.querySelector('.sheet'),close);
}

function progForItem(it){

    L.items.forEach(i=>{if(i.done&&(pId==null||doneBucket(i)===pId)&&(dId==='*'?true:dId?(i.dir===dId||'jar_'+i.jar===dId):(!i.dir||!dirById(i.dir))&&!(i.jar&&jarById(i.jar)))){i.hidden=true;forgetDone(i)}});
    haptic('light');save();flip(render)},
  menu:t=>itemMenu(t.dataset.id),
  prPlus:t=>{const f=findItem(t.dataset.id);if(!f)return;const x=jarItemOf(f.it);if(!x||!x.pr||prDone(x.pr))return;
    if(x.pr.u!=='s') return prAddSheet(f.it.id);
    if(prMark(f.it,x,1)){save();if(!prFinishIfDone(f.it,x)){render();toast(prText(x.pr)+' · звезда в баночку копилок')}}},
  switch:t=>switchSheet(t.dataset.id),
  unfinish:t=>{const d=dirById(t.dataset.d),p=d&&d.progs.find(x=>x.id===t.dataset.p);if(!p)return;p.status='queue';delete p.doneOn;fixNext(d);save();render();toast('Программа вернулась в очередь')},
  startNext:t=>{const d=dirById(t.dataset.id);const n=cyc(d).length;if(!n)return;startProgram(curWeek(),d,(d.next||0)%n,true);save();render();haptic('medium')},
  addOne:()=>addOneSheet(),
  addDir:()=>dirSheet(null),
  editDir:t=>dirSheet(t.dataset.id),
  addProg:t=>progSheet(t.dataset.id,null),
  editProg:t=>progSheet(t.dataset.d,t.dataset.p),
  addStable:()=>stableSheet(null),
  editStable:t=>stableSheet(t.dataset.id),
  bg:t=>{const k=t.dataset.k;if(k==='photo'&&!photo){document.getElementById('photoIn').click();return}state.theme.bg=k;save();applyTheme();render()},
  unplan:t=>{const j=jarById(t.dataset.j),x=j&&j.items.find(y=>y.id===t.dataset.x);if(x){x.st='idle';delete x.date;save();render();haptic('light')}},
  pickPhoto:()=>document.getElementById('photoIn').click(),
  jar:t=>{state.theme.jar=t.dataset.k;save();render();haptic('light')}
};

let toastT;

/* ================= перетаскивание ================= */
let dragBlockUntil=0, dragActive=false;
document.addEventListener('touchmove',e=>{if(dragActive)e.preventDefault()},{passive:false});
document.addEventListener('click',e=>{if(Date.now()<dragBlockUntil){e.preventDefault();e.stopPropagation()}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.drag-item'))e.preventDefault()});
function sortable(box,itemSel,handleSel,done){
  if(!box||box.__sortable) return; box.__sortable=1;
  box.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    const handle=e.target.closest(handleSel); if(!handle||!box.contains(handle)) return;
    const item=handle.closest(itemSel); if(!item||item.parentElement!==box) return;
    const items=()=>[...box.children].filter(x=>x.matches(itemSel));
    if(items().length<2) return;
    const sx=e.clientX, sy=e.clientY; let started=false, timer, baseY=sy, offset=0;
    const cleanup=()=>{clearTimeout(timer);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
    const start=()=>{started=true;dragActive=true;item.classList.add('dragging');haptic('medium')};
    const move=ev=>{
      if(!started){if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8){cleanup()}return}
      ev.preventDefault();
      const dy=ev.clientY-baseY;
      item.style.transform=`translateY(${dy}px)`;
      const list=items(), i=list.indexOf(item);
      const prev=list[i-1], next=list[i+1];
      if(prev){const r=prev.getBoundingClientRect(); if(ev.clientY<r.top+r.height/2){const t0=item.offsetTop;box.insertBefore(item,prev);baseY+=item.offsetTop-t0;item.style.transform=`translateY(${ev.clientY-baseY}px)`;haptic('light');return}}
      if(next){const r=next.getBoundingClientRect(); if(ev.clientY>r.top+r.height/2){const t0=item.offsetTop;box.insertBefore(next,item);baseY+=item.offsetTop-t0;item.style.transform=`translateY(${ev.clientY-baseY}px)`;haptic('light')}}
    };
    const finish=()=>{
      cleanup(); if(!started) return;
      dragActive=false; dragBlockUntil=Date.now()+400;
      item.classList.add('drag-anim'); item.style.transform='';
      setTimeout(()=>{item.classList.remove('dragging','drag-anim');done(items().map(x=>x.dataset.p||x.dataset.id))},190);
    };
    const up=()=>finish(), cancel=()=>{if(started)finish();else cleanup()};
    timer=setTimeout(start,380);
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',cancel);
  });
}
function bindProgsDrag(){
  sortable(document.getElementById('dirlist'),'.card.dir','.dir-head',ids=>{
    const order=ids.join(); if(order===state.dirs.map(d=>d.id).join()) return;
    state.dirs.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); save(); render();
  });
  document.querySelectorAll('.plist').forEach(box=>sortable(box,'.prow','.prow',ids=>{
    const d=dirById(box.dataset.d); if(!d) return;
    if(ids.join()===d.progs.filter(p=>p.status!=='done').map(p=>p.id).join()) return;
    d.progs.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); fixNext(d); save(); render();
  }));
}
function reorderIn(list,ids){
  const pos=[];list.items.forEach((it,i)=>{if(ids.includes(it.id))pos.push(i)});
  const moved=ids.map(id=>list.items.find(i=>i.id===id)).filter(Boolean);
  if(moved.length!==pos.length) return false;
  if(pos.every((p,k)=>list.items[p]===moved[k])) return false;
  pos.forEach((p,k)=>list.items[p]=moved[k]); return true;
}
function bindHomeDrag(){
  sortableGrid(document.querySelector('.stk-grid'),'.stk',ids=>{if(reorderIn(state.pins,ids)){save();render()}});
  document.querySelectorAll('.ilist').forEach(box=>sortable(box,'.item','.item',ids=>{
    const list=box.dataset.k==='day'?curDay():box.dataset.k==='pin'?state.pins:curWeek();
    if(reorderIn(list,ids)){save();render()}
  }));
}
// Экран не собирается заново: сравниваем новое с тем, что уже на экране, и меняем только отличия.
function morph(el,html){const t=document.createElement('template');t.innerHTML=html;patchKids(el,t.content)}
function patchKids(a,b){
  const an=[...a.childNodes], bn=[...b.childNodes];
  bn.forEach((y,i)=>{const x=an[i]; if(!x) a.appendChild(y); else patchNode(a,x,y)});
  for(let i=an.length-1;i>=bn.length;i--) a.removeChild(an[i]);
}
function patchNode(p,x,y){
  if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&x.getAttribute('data-id')!==y.getAttribute('data-id'))){p.replaceChild(y,x);return}
  if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
  for(const at of [...x.attributes]) if(!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for(const at of [...y.attributes]) if(x.getAttribute(at.name)!==at.value) x.setAttribute(at.name,at.value);
  patchKids(x,y);
}
function viewBox(t){
  const v=document.getElementById('view'); let b=v.querySelector(`:scope>section[data-tab="${t}"]`);
  if(!b){const l=v.querySelector(':scope>.loading'); if(l) l.remove(); b=document.createElement('section'); b.dataset.tab=t; v.appendChild(b)}
  return b;
}
const tabScroll={};
function goTab(t){tabScroll[tab]=window.scrollY;tab=t;render();window.scrollTo(0,tabScroll[t]||0)}
function render(){
  const box=viewBox(tab);
  document.querySelectorAll('#view>section').forEach(x=>{x.hidden=x!==box});
  morph(box,tab==='home'?renderHome():tab==='stats'?renderStats():tab==='progs'?renderProgs():tab==='jars'?renderJars():renderLook());
  if(tab==='look') bindLook();
  if(tab==='progs') bindProgsDrag();
  if(tab==='home'){paintStickers(box);bindHomeDrag()}
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  animNew=false; animFun=false;
}

/* ================= запуск ================= */
try{
  if(TG){
    TG.ready(); TG.expand();
    TG.disableVerticalSwipes&&TG.disableVerticalSwipes();
  }
}catch(e){}
// разовое обнуление банки 17 октября 2026: в данных остаётся отметка jarReset1, поэтому второй раз не повторится —
// ни на другом устройстве, ни после возврата прошлой версии через «Вернуть»
function resetJarOnce(){
  if(!state||state.jarReset1) return false;
  state.jarReset1=1; state.seq=[]; return true;
}
// разовый перенос 21 октября 2026: звёзды за идеи из копилок переезжают из основной банки в баночку копилок.
// Отметка funMove1 остаётся в данных, поэтому второй раз перенос не повторится — ни здесь, ни на другом устройстве
function moveJarStarsOnce(){
  if(!state||state.funMove1) return false;
  state.funMove1=1;
  const isJ=k=>String(k).startsWith('j:'), F=state.fun;
  F.seq=state.seq.filter(isJ).concat(F.seq); state.seq=state.seq.filter(k=>!isJ(k));
  for(const d in state.log){const o=state.log[d];
    for(const k in o){if(!isJ(k))continue;const t=F.log[d]||(F.log[d]={});t[k]=(t[k]||0)+o[k];delete o[k]}
    if(!Object.keys(o).length) delete state.log[d]}
  // уже выполненные идеи: если снять с них отметку, звезда уйдёт из баночки копилок
  [state.pins,...Object.values(state.days||{}),...Object.values(state.weeks||{})].forEach(L=>L&&L.items&&L.items.forEach(i=>{if(i.jar&&i.done)i.fs=1}));
  return true;
}
function gate(title,text,retry){
  const v=document.getElementById('view');
  v.innerHTML=`<div class="loading gate"><div><div class="gate-t">${title}</div><p>${text}</p>${retry?'<button class="btn main" id="gateRetry">Попробовать ещё раз</button>':''}</div></div>`;
  const b=document.getElementById('gateRetry'); if(b) b.onclick=boot;
}
function settle(){
  if(bootDirty){bootDirty=false;save()}
  if(resetJarOnce()){save();render()}
  if(moveJarStarsOnce()){save();render()}
  setTimeout(gcPinPhotos,1500);
}
async function boot(){
  try{TG&&TG.disableClosingConfirmation&&TG.disableClosingConfirmation()}catch(e){}
  const L=readLocal(); baseRev=L.baseRev; pending=L.pending;
  if(L.s){
    // как в Designdar: сразу показываем то, что сохранено на устройстве, и следом сверяемся с облаком
    state=normalize(L.s); ready=true; quietEnsure(); applyTheme(); render();
    await reconcile(); settle(); return;
  }
  if(!CLOUD){state=normalize(null); ready=true; quietEnsure(); applyTheme(); render(); settle(); return}
  // на этом устройстве ещё ничего нет — ждём облако, чтобы не начать с пустой банки поверх твоих данных
  document.getElementById('view').innerHTML='<div class="loading">открываю банку…</div>';
  if(!(await reconcile())){
    gate('Нет связи с облаком','На этом устройстве ещё нет твоих данных, а облако Telegram сейчас не отвечает. Проверь интернет и попробуй ещё раз.',true);
    return;
  }
  settle();
}
boot();
document.addEventListener('visibilitychange',()=>{
  if(!ready) return;
  if(document.hidden){push();return}
  const after=()=>{ensureWeek();ensureDay();applyRelock();render()};
  if(pending) {push();after()} else pull().then(changed=>{if(!changed)after()});
});
window.addEventListener('pagehide',()=>{if(ready)push()});
setInterval(()=>{if(ready&&!document.hidden)pull()},15000);
